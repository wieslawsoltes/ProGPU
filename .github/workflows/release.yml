name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: NuGet package version to build.
        required: true
        default: 0.1.0-preview.70
      publish:
        description: Build the existing version tag and publish after validation.
        required: true
        type: boolean
        default: false
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  source:
    name: Resolve immutable release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      # A publishing retry can repair runner setup without moving the source tag.
      # Resolve it once, then pin every producer and consumer to that exact commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && format('refs/tags/v{0}', inputs.version) || github.sha }}
      - name: Prepare pinned framework sources
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python3 eng/progpu-prepare-framework-sources.py
      - id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  xlib-runtime:
    name: Linux Xlib WebGPU runtime (${{ matrix.rid }})
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install pinned generator and Linux display dependencies
        run: |
          ./eng/progpu-install-linux-packages.sh clang-18 libclang-18-dev libx11-dev libegl1 libgles2 libgl1-mesa-dri xvfb xauth
          rustup toolchain install 1.99.0 --profile minimal
      - name: Verify dependency and asset admission controls
        run: |
          python3 -m unittest discover -s eng/tests -p test_xlib_runtime.py -v
          for x64 in true false; do
            for arm64 in true false; do
              dotnet msbuild eng/test-xlib-package-targets.proj -p:TestX64=$x64 -p:TestArm64=$arm64 -nologo
            done
          done
      - name: Build exact reviewed Linux runtime and generated ABI controls
        run: python3 eng/build-wgpu-native-linux.py --rid '${{ matrix.rid }}'
      - name: Verify native Xlib presentation and independent context retirement
        run: |
          native=$(find artifacts/wgpu-native-linux -mindepth 2 -maxdepth 2 -type d -name wgpu-native)
          test -n "$native"
          payload="$GITHUB_WORKSPACE/artifacts/progpu-xlib/package/${{ matrix.rid }}/native"
          clang-18 -std=c11 eng/wgpu-xlib/native-surface-probe.c -I "$native/ffi" -I "$native/ffi/webgpu-headers" -L "$payload" -Wl,-rpath,"$payload" -lwgpu_native -lX11 -ldl -o artifacts/wgpu-native-linux/native-surface-probe
          timeout 60s xvfb-run -a artifacts/wgpu-native-linux/native-surface-probe
      - name: Upload verified Linux dependency
        uses: actions/upload-artifact@v7
        with:
          name: progpu-xlib-runtime-${{ matrix.rid }}
          path: artifacts/progpu-xlib/package
          if-no-files-found: error

  dx12-runtime:
    name: Build Windows compiler runtime (${{ matrix.rid }})
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Prepare pinned framework sources
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python3 eng/progpu-prepare-framework-sources.py
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build verified compiler runtime
        shell: pwsh
        run: |
          ./eng/test-dx12-runtime-inputs.ps1
          ./eng/build-progpu-dx12-runtime-windows.ps1 -Rid '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v7
        with:
          name: progpu-dx12-runtime-${{ matrix.rid }}
          path: artifacts/progpu-dx12/package
          if-no-files-found: error

  native-runtime:
    name: Build native runtime (${{ matrix.rid }})
    needs: [source, xlib-runtime]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-26
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          submodules: recursive

      - name: Prepare pinned framework sources
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python3 eng/progpu-prepare-framework-sources.py
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download verified Linux WebGPU dependency
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-xlib-runtime-*
          path: artifacts/progpu-xlib/package
          merge-multiple: true

      - name: Install Linux WebGPU dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh \
            clang \
            clang-tools \
            cmake \
            ninja-build \
            gnupg \
            fonts-dejavu-core \
            libvulkan1 \
            mesa-vulkan-drivers \
            libx11-xcb1 \
            libxcb1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-present0 \
            libxkbcommon0

      - name: Install macOS native build tools
        if: runner.os == 'macOS'
        run: brew install ninja gnupg

      - name: Verify generated C# native contract
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: ./eng/progpu-verify-native-contract.sh

      - name: Build signed isolated font dependency
        if: runner.os != 'Windows'
        shell: bash
        run: |
          font_workspace="$(mktemp -d "${RUNNER_TEMP}/progpu-freetype.XXXXXXXX")"
          font_workspace="$(cd "$font_workspace" && pwd -P)"
          echo "PROGPU_FREETYPE_WORKSPACE=$font_workspace" >> "$GITHUB_ENV"
          if [[ '${{ runner.os }}' == 'macOS' ]]; then
            test_font='/System/Library/Fonts/Supplemental/Arial.ttf'
          else
            test_font='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          fi
          python3 ./eng/progpu-prepare-freetype.py \
            --workspace "$font_workspace" --rid '${{ matrix.rid }}' --cc clang --cxx clang++ \
            --test-font "$test_font"

      - name: Build signed isolated font dependency on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fontWorkspace = Join-Path $env:RUNNER_TEMP ('progpu-freetype.' + [Guid]::NewGuid().ToString('N'))
          "PROGPU_FREETYPE_WORKSPACE=$fontWorkspace" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          ./eng/progpu-prepare-freetype-windows.ps1 -Rid '${{ matrix.rid }}' -Workspace $fontWorkspace

      - name: Upload verified font dependency and original notices
        uses: actions/upload-artifact@v7
        with:
          name: progpu-freetype-${{ matrix.rid }}
          path: ${{ env.PROGPU_FREETYPE_WORKSPACE }}/install
          if-no-files-found: error

      - name: Fetch exact owned EDIT dictionary source
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tempfile, urllib.request
          pin = json.loads(pathlib.Path('eng/native-edit-word-icu.json').read_text())
          workspace = pathlib.Path(tempfile.mkdtemp(prefix='progpu-edit-icu.', dir=os.environ['RUNNER_TEMP'])).resolve()
          archive = workspace / 'icu-sources.tgz'
          with urllib.request.urlopen(pin['sourceUrl']) as source, archive.open('xb') as output:
              while chunk := source.read(1024 * 1024):
                  output.write(chunk)
          with archive.open('rb') as source:
              actual = hashlib.file_digest(source, 'sha256').hexdigest()
          if actual != pin['sourceSha256']:
              raise SystemExit('Owned EDIT dictionary source differs from the reviewed pin')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PROGPU_EDIT_WORD_ICU_ARCHIVE={archive}\n')
          PY

      - name: Fetch exact owned EDIT dictionary source on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pin = Get-Content -Raw eng/native-edit-word-icu.json | ConvertFrom-Json
          $workspace = Join-Path $env:RUNNER_TEMP ('progpu-edit-icu.' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $workspace | Out-Null
          $archive = Join-Path $workspace 'icu-sources.tgz'
          Invoke-WebRequest -Uri $pin.sourceUrl -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $pin.sourceSha256) {
            throw 'Owned EDIT dictionary source differs from the reviewed pin.'
          }
          "PROGPU_EDIT_WORD_ICU_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and integration-test native renderer
        if: runner.os != 'Windows'
        shell: bash
        env:
          PROGPU_NATIVE_RUN_DAWN_HEADER_CONTRACT: 1
          PROGPU_NATIVE_ENABLE_CPP_MODULES: ${{ matrix.rid == 'linux-x64' && 'ON' || '' }}
        run: |
          ./eng/build-progpu-native.sh --font-manifest "$PROGPU_FREETYPE_WORKSPACE/install/progpu-freetype.json" --edit-word-icu-archive "$PROGPU_EDIT_WORD_ICU_ARCHIVE"
          ./eng/progpu-stage-native-runtime.sh --font-manifest "$PROGPU_FREETYPE_WORKSPACE/install/progpu-freetype.json" --edit-word-icu-archive "$PROGPU_EDIT_WORD_ICU_ARCHIVE"

      - name: Build and integration-test native renderer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./eng/build-progpu-native-windows.ps1
          -Rid "${{ matrix.rid }}"
          -BenchmarkProfile Smoke
          -FontManifest "${{ env.PROGPU_FREETYPE_WORKSPACE }}/install/progpu-freetype.json"
          -EditWordIcuArchive "${{ env.PROGPU_EDIT_WORD_ICU_ARCHIVE }}"

      - name: Verify exact WebScene provider on Metal
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          python3 eng/tests/test_webscene_timeout_diagnostics.py -v
          ./eng/progpu-verify-native-webscene-provider.sh

      - name: Upload WebScene provider hardware evidence
        if: always() && matrix.rid == 'osx-arm64'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-webscene-provider-osx-arm64
          path: |
            artifacts/progpu-native/sample/progpu-native-webscene-provider.ppm
            artifacts/progpu-native/sample/progpu-native-webscene-provider.png
            artifacts/progpu-native/sample/progpu-native-webscene-provider.txt
            artifacts/progpu-native/sample/progpu-native-managed-dawn.ppm
            artifacts/progpu-native/sample/progpu-native-managed-dawn.png
            artifacts/progpu-native/sample/progpu-native-3d-pipeline-demand.rgba
            artifacts/progpu-native/sample/webscene-timeout-diagnostics/**
          if-no-files-found: error

      - name: Upload native backend execution evidence
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-backend-${{ matrix.rid }}
          path: |
            artifacts/progpu-native/sample/progpu-native-sample.ppm
            artifacts/progpu-native/sample/progpu-native-provider.txt
          if-no-files-found: error

      - name: Upload native runtime
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-runtime-${{ matrix.rid }}
          path: artifacts/progpu-native/package
          if-no-files-found: error

  portable:
    name: Validate and pack portable packages
    needs: [source, native-runtime, dx12-runtime, xlib-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          submodules: recursive

      - name: Prepare pinned framework sources
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python3 eng/progpu-prepare-framework-sources.py
      - name: Install Linux WebGPU dependencies
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh \
            libc++1 \
            libvulkan1 \
            mesa-vulkan-drivers \
            libx11-xcb1 \
            libxcb1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-present0 \
            libxkbcommon0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "PROGPU_PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "Resolved ProGPU package version: ${version}"

      - name: Download verified Linux WebGPU dependency
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-xlib-runtime-*
          path: artifacts/progpu-xlib/package
          merge-multiple: true

      - name: Download native runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-native-runtime-*
          path: artifacts/progpu-native/package
          merge-multiple: true

      - name: Download Windows compiler runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-dx12-runtime-*
          path: artifacts/progpu-dx12/package
          merge-multiple: true

      - name: Verify docs and package manifest
        run: ./eng/progpu-verify-docs.sh

      - name: Restore
        run: |
          dotnet restore src/ProGPU.Tests/ProGPU.Tests.csproj --runtime linux-x64
          dotnet restore src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj --runtime linux-x64

      - name: Build tests
        run: |
          dotnet build src/ProGPU.Tests/ProGPU.Tests.csproj --configuration Release --runtime linux-x64 --no-restore -p:ContinuousIntegrationBuild=true -p:Version=${{ env.PROGPU_PACKAGE_VERSION }} -p:PackageVersion=${{ env.PROGPU_PACKAGE_VERSION }}
          dotnet build src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj --configuration Release --runtime linux-x64 --no-restore -p:ContinuousIntegrationBuild=true -p:Version=${{ env.PROGPU_PACKAGE_VERSION }} -p:PackageVersion=${{ env.PROGPU_PACKAGE_VERSION }}

      - name: Test
        shell: bash
        # Allocation contracts measure optimized steady-state hot paths. Avoid
        # crossing a tiered-compilation threshold inside a measured loop.
        env:
          DOTNET_TieredCompilation: "0"
        run: |
          native_root="${GITHUB_WORKSPACE}/src/ProGPU.Tests/bin/Release/net10.0/linux-x64"
          native_rid_root="${native_root}/runtimes/linux-x64/native"
          headless_native_root="${GITHUB_WORKSPACE}/src/ProGPU.Tests.Headless/bin/Release/net10.0/linux-x64"
          headless_native_rid_root="${headless_native_root}/runtimes/linux-x64/native"
          export LD_LIBRARY_PATH="${native_root}:${native_rid_root}:${headless_native_root}:${headless_native_rid_root}:${LD_LIBRARY_PATH:-}"
          # Match the green Linux Build lane: Mesa software execution does not
          # complete the GPU shaping contract suite in practical hosted-CI time.
          # The complete contract remains a local hardware validation.
          dotnet test src/ProGPU.Tests/ProGPU.Tests.csproj --configuration Release --runtime linux-x64 --no-build --verbosity normal --filter "FullyQualifiedName!~ShapingContractsTests"
          dotnet test src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj --configuration Release --runtime linux-x64 --no-build --verbosity normal

      - name: Pack portable packages
        run: PROGPU_PACKAGE_GROUP=portable ./eng/progpu-pack.sh

      - name: Run native package consumer
        run: |
          PROGPU_PACKAGE_VERSION="${PROGPU_PACKAGE_VERSION}" \
          PROGPU_PACKAGE_OUTPUT="${GITHUB_WORKSPACE}/artifacts/packages/Release" \
            ./eng/progpu-verify-native-package.sh

      - name: Pack Avalonia integration packages
        run: PROGPU_PACKAGE_OUTPUT=artifacts/packages-avalonia/Release ./scripts/progpu-pack.sh

      - name: Upload portable packages
        uses: actions/upload-artifact@v7
        with:
          name: progpu-portable-${{ env.PROGPU_PACKAGE_VERSION }}
          path: |
            artifacts/packages/Release/*.nupkg
            artifacts/packages/Release/*.snupkg
          if-no-files-found: error

      - name: Upload Avalonia integration packages
        uses: actions/upload-artifact@v7
        with:
          name: progpu-avalonia-${{ env.PROGPU_PACKAGE_VERSION }}
          path: |
            artifacts/packages-avalonia/Release/*.nupkg
            artifacts/packages-avalonia/Release/*.snupkg
          if-no-files-found: error

  native-dx12-package-consumer:
    name: Native DX12 release consumer (${{ matrix.rid }})
    needs: [source, portable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    env:
      PROGPU_HIT_TEST_EXECUTION: ordered-stages
      PROGPU_DX12_SHADER_COMPILER: dxc
      PROGPU_BACKEND_DIAGNOSTICS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
      - name: Prepare pinned framework sources
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python3 eng/progpu-prepare-framework-sources.py
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "PROGPU_PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"
      - uses: actions/download-artifact@v8
        with:
          name: progpu-portable-${{ env.PROGPU_PACKAGE_VERSION }}
          path: artifacts/packages/Release
      - name: Run full JIT and NativeAOT system-WARP consumers
        shell: pwsh
        run: |
          $project = 'tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj'
          $properties = @('-p:ProGpuUseDx12Runtime=true', "-p:ProGpuNativePackageSource=$env:GITHUB_WORKSPACE/artifacts/packages/Release", "-p:ProGpuNativePackageVersion=$env:PROGPU_PACKAGE_VERSION")
          dotnet run --project $project --configuration Release --runtime '${{ matrix.rid }}' @properties -- --software-adapter
          if ($LASTEXITCODE -ne 0) { throw 'Full release DX12 consumer failed.' }
          $output = "$env:GITHUB_WORKSPACE/artifacts/dx12-consumer-aot"
          dotnet publish $project --configuration Release --runtime '${{ matrix.rid }}' -p:PublishAot=true --output $output @properties
          if ($LASTEXITCODE -ne 0) { throw 'Release DX12 NativeAOT publication failed.' }
          & "$output/ProGPU.Native.PackageConsumer.exe" --software-adapter
          if ($LASTEXITCODE -ne 0) { throw 'Full release DX12 NativeAOT consumer failed.' }

  native-package-consumer:
    name: Native release package consumer (${{ matrix.rid }})
    needs: [source, portable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-26
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Prepare pinned framework sources
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python3 eng/progpu-prepare-framework-sources.py
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Linux WebGPU dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh libc++1 libvulkan1 mesa-vulkan-drivers

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "PROGPU_PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Download portable packages
        uses: actions/download-artifact@v8
        with:
          name: progpu-portable-${{ env.PROGPU_PACKAGE_VERSION }}
          path: artifacts/packages/Release

      - name: Restore and run source-independent package consumer
        shell: bash
        run: |
          dotnet restore tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages/Release" \
            -p:ProGpuNativePackageVersion="${PROGPU_PACKAGE_VERSION}"
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages/Release" \
            -p:ProGpuNativePackageVersion="${PROGPU_PACKAGE_VERSION}"
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages/Release" \
            -p:ProGpuNativePackageVersion="${PROGPU_PACKAGE_VERSION}" -- \
            --mil-drawing-group-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages/Release" \
            -p:ProGpuNativePackageVersion="${PROGPU_PACKAGE_VERSION}" -- \
            --mil-glyph-run-drawing-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages/Release" \
            -p:ProGpuNativePackageVersion="${PROGPU_PACKAGE_VERSION}" -- \
            --mil-text-render-options-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages/Release" \
            -p:ProGpuNativePackageVersion="${PROGPU_PACKAGE_VERSION}" -- \
            --mil-visual-clip-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages/Release" \
            -p:ProGpuNativePackageVersion="${PROGPU_PACKAGE_VERSION}" -- \
            --mil-visual-opacity-mask-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages/Release" \
            -p:ProGpuNativePackageVersion="${PROGPU_PACKAGE_VERSION}" -- \
            --mil-visual-effect-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages/Release" \
            -p:ProGpuNativePackageVersion="${PROGPU_PACKAGE_VERSION}" -- \
            --mil-visual-guideline-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages/Release" \
            -p:ProGpuNativePackageVersion="${PROGPU_PACKAGE_VERSION}" -- \
            --mil-drawing-image-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-build \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages/Release" \
            -p:ProGpuNativePackageVersion="${PROGPU_PACKAGE_VERSION}" -- \
            --mil-guideline-only

  mobile:
    name: Pack mobile packages
    needs: source
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          submodules: recursive

      - name: Prepare pinned framework sources
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python3 eng/progpu-prepare-framework-sources.py
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android NDK
        shell: bash
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "${GITHUB_ENV}"

      - name: Build provider-resolved mobile C++ renderer
        shell: bash
        run: ./eng/build-progpu-native-mobile.sh all

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "PROGPU_PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Verify package manifest
        run: ./eng/progpu-verify-package-list.sh

      - name: Restore mobile workloads
        run: |
          dotnet workload restore src/ProGPU.Android/ProGPU.Android.csproj --skip-manifest-update
          dotnet workload restore src/ProGPU.iOS/ProGPU.iOS.csproj --skip-manifest-update

      - name: Pack mobile packages
        run: |
          PROGPU_PACKAGE_GROUP=mobile \
          PROGPU_PACKAGE_OUTPUT=artifacts/packages-mobile/Release \
            ./eng/progpu-pack.sh
          PROGPU_PACKAGE_OUTPUT=artifacts/packages-mobile/Release \
            ./eng/progpu-verify-native-mobile-package.sh

      - name: Upload mobile C++ renderer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-mobile-${{ env.PROGPU_PACKAGE_VERSION }}
          path: artifacts/progpu-native/mobile
          if-no-files-found: error

      - name: Upload mobile packages
        uses: actions/upload-artifact@v7
        with:
          name: progpu-mobile-${{ env.PROGPU_PACKAGE_VERSION }}
          path: |
            artifacts/packages-mobile/Release/*.nupkg
            artifacts/packages-mobile/Release/*.snupkg
          if-no-files-found: error

  publish:
    name: Verify and publish complete release
    needs: [source, portable, native-package-consumer, native-dx12-package-consumer, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Prepare pinned framework sources
        shell: bash
        working-directory: ${{ github.workspace }}
        run: python3 eng/progpu-prepare-framework-sources.py
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "PROGPU_PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Download portable packages
        uses: actions/download-artifact@v8
        with:
          name: progpu-portable-${{ env.PROGPU_PACKAGE_VERSION }}
          path: artifacts/packages/Release

      - name: Download mobile packages
        uses: actions/download-artifact@v8
        with:
          name: progpu-mobile-${{ env.PROGPU_PACKAGE_VERSION }}
          path: artifacts/packages/Release

      - name: Download Avalonia integration packages
        uses: actions/download-artifact@v8
        with:
          name: progpu-avalonia-${{ env.PROGPU_PACKAGE_VERSION }}
          path: artifacts/packages-avalonia/Release

      - name: Verify complete package set and dependency closure
        run: PROGPU_PACKAGE_GROUP=all ./eng/progpu-verify-packages.sh

      - name: Check every package and symbol upload size
        run: python3 ./eng/progpu-verify-package-sizes.py artifacts/packages/Release artifacts/packages-avalonia/Release

      - name: Upload complete NuGet release
        uses: actions/upload-artifact@v7
        with:
          name: progpu-nuget-${{ env.PROGPU_PACKAGE_VERSION }}
          path: |
            artifacts/packages/Release/*.nupkg
            artifacts/packages/Release/*.snupkg
            artifacts/packages-avalonia/Release/*.nupkg
            artifacts/packages-avalonia/Release/*.snupkg
          if-no-files-found: error

      - name: Publish runtime packages to NuGet.org
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          for package in artifacts/packages/Release/*.nupkg; do
            if [[ "${package}" == *.snupkg ]]; then
              continue
            fi
            dotnet nuget push "${package}" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Publish Avalonia integration packages to NuGet.org
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          for package in artifacts/packages-avalonia/Release/*.nupkg; do
            if [[ "${package}" == *.snupkg ]]; then
              continue
            fi
            dotnet nuget push "${package}" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Create GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=()
          if [[ "${PROGPU_PACKAGE_VERSION}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "v${PROGPU_PACKAGE_VERSION}" \
            artifacts/packages/Release/*.nupkg \
            artifacts/packages/Release/*.snupkg \
            artifacts/packages-avalonia/Release/*.nupkg \
            artifacts/packages-avalonia/Release/*.snupkg \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ProGPU ${{ env.PROGPU_PACKAGE_VERSION }}" \
            --generate-notes \
            --verify-tag \
            "${release_args[@]}"

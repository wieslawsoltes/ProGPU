name: ARM64 scalar candidate native exception capture
permissions:
  contents: read
  actions: read
jobs:
  run:
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      ROUTE: dxc
      CANDIDATE_ROOT: ${{ github.workspace }}/candidate
      ORIGINAL: ${{ github.workspace }}/original
      FEED: ${{ github.workspace }}/packages
      PAYLOAD: ${{ github.workspace }}/payload
      EVIDENCE: ${{ github.workspace }}/evidence
      CAPTURE_OUTPUT: ${{ github.workspace }}/evidence
      EXECUTION: ${{ github.workspace }}/execution
      PROGPU_HIT_TEST_EXECUTION: ordered-stages
      PROGPU_BACKEND_DIAGNOSTICS: '1'
      PROGPU_DX12_SHADER_COMPILER: dxc
      CANDIDATE_RECEIPT_SHA256: 17c95a8198c7265f35bbb0327dee22b2e5e88987fb449ed812668e245865cf33
      CANDIDATE_ARTIFACT_ID: '12833125381'
      CANDIDATE_ARTIFACT_DIGEST: 12ee6a7f52773b416120bdf1a7b49761d02925531586602adb9b6e4d4b6ab63a
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: diagnostic
    - uses: actions/checkout@v7
      with:
        ref: 686a34bb092ada9eec73b3ce1381dcb592e276b6
        path: original
    - uses: actions/checkout@v7
      with:
        ref: 1f81f86e6f004bac53e939e18d1a239fac464c49
        path: candidate
    - uses: actions/setup-dotnet@v5
      with:
        global-json-file: original/global.json
    - uses: actions/download-artifact@v8
      with:
        artifact-ids: '12816562451'
        run-id: '40682174680'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: packages
        merge-multiple: true
        digest-mismatch: error
    - uses: actions/download-artifact@v8
      with:
        artifact-ids: '12833125381'
        run-id: '40723636434'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: payload
        merge-multiple: true
        digest-mismatch: error
    - name: Prepare original consumer and private two-DLL overlay
      shell: pwsh
      run: "python diagnostic/eng/diagnostics/arm64-scalar-cdb/stage.py prepare\nif ($LASTEXITCODE -ne 0) { throw 'Original\
        \ source/package identity failed.' }\nPush-Location original\ntry {\n  python eng/progpu-prepare-framework-sources.py\n\
        \  if ($LASTEXITCODE -ne 0) { throw 'Framework source preparation failed.' }\n  $properties=@()\n  if ($env:ROUTE\
        \ -eq 'dxc') { $properties+='-p:ProGpuUseDx12Runtime=true' }\n  if ($env:ROUTE -eq 'dawn') { $properties+='-p:ProGpuDawnSystemWarpTestRid=win-arm64'\
        \ }\n  dotnet build tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj --configuration Release\
        \ --runtime win-arm64 -p:ProGpuNativePackageSource=\"$env:FEED\" -p:ProGpuNativePackageVersion=0.1.0-preview.3676.ci\
        \ @properties\n  if ($LASTEXITCODE -ne 0) { throw 'Original package consumer build failed.' }\n} finally { Pop-Location\
        \ }\n$vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'\n$vs=& $vswhere -latest\
        \ -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath\nif ($LASTEXITCODE\
        \ -ne 0 -or -not $vs) { throw 'Native tool host unavailable.' }\nImport-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')\n\
        Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=arm64 -host_arch=arm64' | Out-Null\n\
        python diagnostic/eng/diagnostics/arm64-scalar-cdb/stage.py artifact\nif ($LASTEXITCODE -ne 0) { throw 'Candidate artifact\
        \ admission failed.' }\npython diagnostic/eng/diagnostics/arm64-scalar-cdb/stage.py stage\nif ($LASTEXITCODE -ne 0)\
        \ { throw 'Private overlay admission failed.' }\n"
    - name: Verify signed native debugger and compile original CPU admission control
      shell: pwsh
      run: ./diagnostic/eng/diagnostics/arm64-scalar-cdb/prepare-tools.ps1 -Control FirstChanceControl
    - name: Prove unchanged native handling and exact final control exit
      shell: pwsh
      run: 'python diagnostic/eng/diagnostics/arm64-scalar-cdb/cdb_first_chance.py control

        if ($LASTEXITCODE -ne 0) { throw ''CPU debugger admission failed; candidate is not executed.'' }

        '
    - name: Capture one changed-candidate DXC workload within original bounds
      shell: pwsh
      run: 'python diagnostic/eng/diagnostics/arm64-scalar-cdb/cdb_first_chance.py workload

        if ($LASTEXITCODE -ne 0) { throw ''Capture incomplete; evidence retained with no retry.'' }

        '
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: arm64-scalar-candidate-native-events
        path: evidence
        if-no-files-found: error
'on':
  pull_request:
    branches:
    - fix/source-binary-glyph-raster
    paths:
    - eng/diagnostics/arm64-scalar-cdb/**
    - .github/workflows/arm64-scalar-cdb.yml

name: Native path diagnostics

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Build run containing the package under investigation (use 0 for package-free probes)
        required: true
        type: string
      probe_set:
        description: Independent owner/path diagnosis or package-free allocation/shader probes
        type: choice
        default: all
        options: [all, lifetime, atlas, raster, encoder, retirement, fence, owner, allocation-counter, hinted-texture, hinted-native-frame, hinted-canonical-frame, hinted-native-input]

permissions:
  contents: read
  actions: read

# Package-backed path probes reuse an earlier package; allocation and hinted
# texture probes do not. Authentic hinted-input capture builds fresh unqualified
# native binaries inside its one ephemeral job; only data/logs leave that job.
# None replaces a complete current-head Build/package gate.
jobs:
  allocation-counter:
    if: inputs.probe_set == 'allocation-counter'
    uses: ./.github/workflows/runtime-allocation-diagnostics.yml

  hinted-texture:
    if: inputs.probe_set == 'hinted-texture' || inputs.probe_set == 'hinted-native-frame' || inputs.probe_set == 'hinted-canonical-frame'
    name: Windows hinted texture sampling
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Compare shared shaders and independent coverage on an explicit software device
        shell: pwsh
        env:
          USE_NATIVE_FRAME: ${{ inputs.probe_set == 'hinted-native-frame' }}
          USE_CANONICAL_FRAME: ${{ inputs.probe_set == 'hinted-canonical-frame' }}
        run: |
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/hinted-texture-sampling'
          $dataDirectory = Join-Path $outputDirectory 'data'
          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probes = @(@{ Name = 'data'; Arguments = @() })
          if ($env:USE_NATIVE_FRAME -eq 'true') {
            $probes[0].Arguments = @('--native-frame')
          }
          if ($env:USE_CANONICAL_FRAME -eq 'true') {
            $probes = @(
              @{ Name = 'original-frame'; Arguments = @('--native-frame') },
              @{ Name = 'canonical-frame'; Arguments = @('--native-frame', '--canonical-frame') },
              @{ Name = 'binary-oracle'; Arguments = @('--native-frame', '--canonical-frame', '--binary-oracle') }
            )
          }
          $firstFailure = 0
          foreach ($probe in $probes) {
            $dataDirectory = Join-Path $outputDirectory $probe.Name
            $probeArguments = $probe.Arguments
            dotnet run --project eng/HintedTextureSamplingProbe/HintedTextureSamplingProbe.csproj `
              --configuration Release -- --output $dataDirectory --fallback @probeArguments 2>&1 |
              Tee-Object -FilePath (Join-Path $outputDirectory ($probe.Name + '.log'))
            if ($LASTEXITCODE -ne 0 -and $firstFailure -eq 0) { $firstFailure = $LASTEXITCODE }
          }
          if ($firstFailure -ne 0) { exit $firstFailure }
      - name: Preserve exact shader and device observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hinted-texture-sampling-win-x64-${{ github.sha }}
          path: artifacts/hinted-texture-sampling/
          if-no-files-found: error
          retention-days: 14

  hinted-native-input:
    if: inputs.probe_set == 'hinted-native-input'
    name: Windows authentic hinted paint failure inputs
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Prepare fresh diagnostic provenance
        shell: pwsh
        env:
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          if ($env:PACKAGE_RUN_ID -ne '0') { throw 'Fresh-source input capture requires package_run_id=0; no earlier Build payload is admitted.' }
          if ([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'X64') { throw 'This diagnostic requires a native Windows x64 host.' }
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/hinted-native-input'
          if (Test-Path $outputDirectory) { throw 'Diagnostic output must be fresh.' }
          New-Item -ItemType Directory -Path $outputDirectory | Out-Null
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Checkout does not match the requested exact head.' }
          "Source=$head; run=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT; scope=fresh unqualified job-local diagnostic only" |
            Set-Content (Join-Path $outputDirectory 'provenance.txt')
          $fontWorkspace = Join-Path $env:RUNNER_TEMP ('progpu-hinted-input-freetype.' + [Guid]::NewGuid().ToString('N'))
          "PROGPU_FREETYPE_WORKSPACE=$fontWorkspace" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prepare the original signed isolated font dependency
        shell: pwsh
        run: |
          ./eng/progpu-prepare-freetype-windows.ps1 -Rid win-x64 -Workspace $env:PROGPU_FREETYPE_WORKSPACE 2>&1 |
            Tee-Object -FilePath artifacts/hinted-native-input/font-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:PROGPU_FREETYPE_WORKSPACE/install/progpu-freetype.json" artifacts/hinted-native-input/font-dependency.json
      - name: Compile fresh native source without release qualification
        shell: pwsh
        run: |
          ./eng/build-progpu-native-windows.ps1 -Rid win-x64 -Compiler ClangCL -Generator Ninja -BuildOnly `
            -FontManifest "$env:PROGPU_FREETYPE_WORKSPACE/install/progpu-freetype.json" 2>&1 |
            Tee-Object -FilePath artifacts/hinted-native-input/native-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # BuildOnly retains both providers, Direct2D, SDK and test/sample
          # compilation. These fresh outputs are NOT a qualified package/feed.
          @('artifacts/progpu-native/build-win-x64/progpu_native.dll',
            'artifacts/progpu-native/build-win-x64/progpu_native_dawn.dll',
            'artifacts/progpu-native/build-win-x64/progpu_native_direct2d.dll',
            'artifacts/progpu-native/runtime-win-x64/wgpu_native.dll',
            'src/ProGPU.Fonts.Inter/Fonts/Inter-Regular.ttf',
            'eng/native-freetype.json') | ForEach-Object {
              Get-FileHash -LiteralPath $_ -Algorithm SHA256
            } | Format-List | Out-File artifacts/hinted-native-input/fresh-input-hashes.txt
      - name: Compile the original hinted consumer against project references
        shell: pwsh
        run: |
          dotnet build tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj `
            -c Release -r win-x64 -p:ProGpuNativeUseProjectReference=true 2>&1 |
            Tee-Object -FilePath artifacts/hinted-native-input/consumer-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture authentic inputs while retaining the original pixel failure
        shell: pwsh
        timeout-minutes: 10
        run: |
          $consumer = Join-Path $env:GITHUB_WORKSPACE 'tests/ProGPU.Native.PackageConsumer/bin/Release/net10.0/win-x64'
          if (Get-ChildItem -LiteralPath $consumer -Filter 'progpu_native*.dll' -Recurse) {
            throw 'Consumer output must not contain an overriding native payload.'
          }
          $nativeBuild = Join-Path $env:GITHUB_WORKSPACE 'artifacts/progpu-native/build-win-x64'
          $nativeRuntime = Join-Path $env:GITHUB_WORKSPACE 'artifacts/progpu-native/runtime-win-x64'
          $env:PATH = "$nativeBuild;$nativeRuntime;$env:PATH"
          $env:PROGPU_HINTED_PAINT_FAILURE_OUTPUT = Join-Path $env:GITHUB_WORKSPACE 'artifacts/hinted-native-input/data'
          $env:PROGPU_HINTED_PAINT_NATIVE_PATH = (Resolve-Path (Join-Path $nativeBuild 'progpu_native.dll')).Path
          $env:PROGPU_HINTED_PAINT_NATIVE_SHA256 = (Get-FileHash -LiteralPath $env:PROGPU_HINTED_PAINT_NATIVE_PATH -Algorithm SHA256).Hash
          $env:PROGPU_HINTED_PAINT_WGPU_SHA256 = (Get-FileHash -LiteralPath (Join-Path $nativeRuntime 'wgpu_native.dll') -Algorithm SHA256).Hash
          dotnet (Join-Path $consumer 'ProGPU.Native.PackageConsumer.dll') `
            --text-hinted-paragraph-render-only --software-adapter 2>&1 |
            Tee-Object -FilePath artifacts/hinted-native-input/consumer.log
          $consumerExitCode = $LASTEXITCODE
          "Original consumer exit=$consumerExitCode" | Add-Content artifacts/hinted-native-input/provenance.txt
          # A receipt is diagnostic evidence, never permission to waive the
          # exact original full-RGBA assertion or turn a failing job green.
          if ($consumerExitCode -ne 0) { exit $consumerExitCode }
      - name: Preserve captured data and logs only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hinted-native-input-win-x64-${{ github.sha }}
          path: artifacts/hinted-native-input/
          if-no-files-found: error
          retention-days: 14

  windows-path-stage:
    if: inputs.probe_set != 'allocation-counter' && inputs.probe_set != 'hinted-texture' && inputs.probe_set != 'hinted-native-frame' && inputs.probe_set != 'hinted-canonical-frame' && inputs.probe_set != 'hinted-native-input'
    name: Windows path-stage diagnosis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Resolve original package provenance
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          if ($env:PACKAGE_RUN_ID -notmatch '^[0-9]+$') { throw 'Invalid package run ID.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PACKAGE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve package run.' }
          if ($run.path -ne '.github/workflows/build.yml' -or $run.status -ne 'completed') {
            throw 'Select a completed Build run; a failed consumer run is allowed for diagnosis.'
          }
          $version = "0.1.0-preview.$($run.run_number).ci"
          "version=$version" >> $env:GITHUB_OUTPUT
          "run_id=$env:PACKAGE_RUN_ID" >> $env:GITHUB_OUTPUT
          "Package=$version original-head=$($run.head_sha) run=$($run.html_url) conclusion=$($run.conclusion)"
      - name: Download original native packages
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.package.outputs.run_id }}
          name: progpu-native-package
          path: artifacts/path-diagnostic-packages
      - name: Execute independent cold path-stage probes
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PROBE_SET: ${{ inputs.probe_set }}
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'artifacts/path-diagnostic-packages'
          Get-ChildItem -LiteralPath $source -Filter '*.nupkg' | Get-FileHash -Algorithm SHA256 | Format-List
          dotnet build tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj `
            --configuration Release "-p:ProGpuNativePackageSource=$source" `
            "-p:ProGpuNativePackageVersion=$env:PACKAGE_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $failed = $false
          $probes = if ($env:PROBE_SET -eq 'owner') {
            @('--native-owner-query-probe')
          } elseif ($env:PROBE_SET -eq 'fence') {
            @('--path-native-retire-raster-probe', '--path-native-fence-retire-raster-probe', '--native-path-probe', '--native-path-deferred-retirement-probe')
          } elseif ($env:PROBE_SET -eq 'retirement') {
            @('--path-native-release-encoding-probe', '--path-native-retire-raster-probe', '--native-path-probe', '--native-path-deferred-retirement-probe', '--native-cubic-probe')
          } elseif ($env:PROBE_SET -eq 'encoder') {
            @('--path-native-submit-probe', '--path-native-release-encoder-probe', '--path-native-release-encoding-probe', '--native-path-probe', '--native-cubic-probe')
          } elseif ($env:PROBE_SET -eq 'raster') {
            @('--path-native-submit-probe', '--path-native-raster-binding-probe', '--path-native-raster-zero-probe', '--path-native-raster-probe', '--native-path-probe', '--native-cubic-probe')
          } elseif ($env:PROBE_SET -eq 'atlas') {
            @('--path-native-submit-probe', '--path-native-atlas-usage-probe', '--path-native-atlas-view-probe', '--path-native-atlas-probe', '--native-path-probe', '--native-cubic-probe')
          } elseif ($env:PROBE_SET -eq 'lifetime') {
            @('--path-native-submit-probe', '--path-native-release-buffers-probe', '--path-native-release-command-probe', '--native-path-probe', '--native-cubic-probe')
          } else {
            @('--path-coverage-probe', '--path-vector-probe', '--path-vector-batched-probe', '--path-native-layout-probe', '--path-native-bindings-probe', '--path-native-submit-probe', '--path-native-release-probe', '--native-path-probe', '--native-cubic-probe')
          }
          foreach ($probe in $probes) {
            Write-Output "Independent process: $probe"
            dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj `
              --configuration Release --no-build "-p:ProGpuNativePackageSource=$source" `
              "-p:ProGpuNativePackageVersion=$env:PACKAGE_VERSION" -- $probe
            Write-Output "Probe $probe exit=$LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

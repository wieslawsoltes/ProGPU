name: Native path diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  original-scenes:
    name: Original Windows scenes with whole-qualified products
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare the unchanged original scenes and native probe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python eng/vertical-original-scenes.py
      - name: Retain original images, timings and producer receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vertical-original-scenes-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/vertical-original-scenes/*.json
            ${{ runner.temp }}/vertical-original-scenes/*.log
            ${{ runner.temp }}/vertical-original-scenes/case-*
          if-no-files-found: error
          retention-days: 7

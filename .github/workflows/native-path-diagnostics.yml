name: Native path diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raster-loop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile actual shaders and compare original coverage
        run: python eng/diagnostics/packed-raster-loop/run.py
      - name: Preserve every process result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-raster-loop-${{ matrix.os }}-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/packed-raster-loop/*.log
            ${{ runner.temp }}/packed-raster-loop/*.json

name: Retained image finalizer Windows diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  image-retirement:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Require exact successful whole producer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'aef75180bcdc3b937d004b6b949e0e91724c7981'
          $run = gh api repos/wieslawsoltes/ProGPU/actions/runs/38549555561 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Producer metadata lookup failed.' }
          $jobs = gh api 'repos/wieslawsoltes/ProGPU/actions/runs/38549555561/jobs?per_page=100' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Producer jobs lookup failed.' }
          if ($run.head_sha -ne $expected -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') {
            throw 'The exact whole producer has not succeeded.'
          }
          if ($jobs.total_count -ne 59 -or $jobs.jobs.Count -ne 59) { throw 'Missing whole producer jobs.' }
          foreach ($job in $jobs.jobs) {
            if ($job.head_sha -ne $expected -or $job.status -ne 'completed' -or $job.conclusion -ne 'success') {
              throw "Unqualified producer job: $($job.id)"
            }
          }
          $companions = @()
          foreach ($id in 38549554968, 38549555121, 38549555571, 38549555194, 38549555376, 38549555491) {
            $companion = gh api "repos/wieslawsoltes/ProGPU/actions/runs/$id" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $companion.head_sha -ne $expected -or $companion.status -ne 'completed' -or $companion.conclusion -ne 'success') {
              throw "Unqualified companion workflow: $id"
            }
            $companions += $companion
          }
          @{ run = $run; jobs = $jobs; companions = $companions } | ConvertTo-Json -Depth 30 |
            Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'image-finalizer-producer.json')

      - name: Checkout exact product source
        uses: actions/checkout@v7
        with:
          ref: aef75180bcdc3b937d004b6b949e0e91724c7981
          submodules: recursive
          persist-credentials: false

      - name: Prepare pinned framework sources
        shell: bash
        run: python3 eng/progpu-prepare-framework-sources.py

      - name: Setup original SDK policy
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build unchanged original test project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne 'aef75180bcdc3b937d004b6b949e0e91724c7981') { throw 'Unexpected product checkout.' }
          dotnet restore src/ProGPU.Tests/ProGPU.Tests.csproj --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          git diff --exit-code -- src/SkiaSharp src/ProGPU.Backend src/ProGPU.Tests
          if ($LASTEXITCODE -ne 0) { throw 'Product or original test source changed.' }
          dotnet build src/ProGPU.Tests/ProGPU.Tests.csproj --configuration Release --runtime win-x64 --no-restore -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }

      - name: Run all fourteen original ownership cases once
        shell: pwsh
        env:
          DOTNET_TieredCompilation: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-image-finalizer'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'image-finalizer-producer.json') $out
          $nativeRoot = Join-Path $env:GITHUB_WORKSPACE 'src/ProGPU.Tests/bin/Release/net10.0/win-x64'
          $nativeRidRoot = Join-Path $nativeRoot 'runtimes/win-x64/native'
          $env:PATH = "$nativeRoot;$nativeRidRoot;$env:PATH"
          $source = Join-Path $env:GITHUB_WORKSPACE 'src/ProGPU.Tests/SkImageFinalizerRetirementTests.cs'
          $sourceHash = (Get-FileHash -Algorithm SHA256 $source).Hash
          if ($sourceHash.ToLowerInvariant() -ne 'b3906e03a343286c2ba8af32e492b843484411117b4be3454c7c3780e99e37bd') { throw 'Original test body differs.' }
          $inputs = @(Get-ChildItem $nativeRoot -File -Recurse | Where-Object { $_.Extension -in '.dll', '.exe', '.json' } |
            ForEach-Object { @{ path = $_.FullName.Substring($nativeRoot.Length + 1); sha256 = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash } })
          $inputs | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $out 'input-hashes.json')
          $arguments = @('test', 'src/ProGPU.Tests/ProGPU.Tests.csproj', '--configuration', 'Release',
            '--runtime', 'win-x64', '--no-build', '--verbosity', 'normal', '--filter',
            'FullyQualifiedName~SkImageFinalizerRetirementTests', '--logger', 'trx;LogFileName=image-retirement.trx',
            '--results-directory', 'artifacts/windows-image-finalizer')
          $started = [DateTimeOffset]::UtcNow
          $process = Start-Process dotnet -ArgumentList $arguments -PassThru -NoNewWindow `
            -RedirectStandardOutput (Join-Path $out 'stdout.log') -RedirectStandardError (Join-Path $out 'stderr.log')
          $completed = $process.WaitForExit(180000)
          if (-not $completed) {
            taskkill /PID $process.Id /T /F | Out-File (Join-Path $out 'timeout-cleanup.log')
            throw 'The single test process exceeded its 180-second outer bound.'
          }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "Original ownership cases failed: $($process.ExitCode)" }
          if ((Get-FileHash -Algorithm SHA256 $source).Hash -ne $sourceHash) { throw 'Test source changed.' }
          foreach ($entry in $inputs) {
            if ((Get-FileHash -Algorithm SHA256 (Join-Path $nativeRoot $entry.path)).Hash -ne $entry.sha256) {
              throw "A test input changed: $($entry.path)"
            }
          }
          [xml]$trx = Get-Content -Raw (Join-Path $out 'image-retirement.trx')
          $counts = $trx.TestRun.ResultSummary.Counters
          if ([int]$counts.total -ne 14 -or [int]$counts.executed -ne 14 -or [int]$counts.passed -ne 14) {
            throw 'All fourteen original cases must execute and pass without skips.'
          }
          $expected = @()
          foreach ($backend in 'False', 'True') {
            foreach ($method in 'ExplicitImageDisposalKeepsCreatingThreadNotification', 'AbandonedImagePreservesTheLastRetainedLease', 'AbandonedBorrowedImageLeavesTheOwnerTextureAlive') {
              $expected += "ProGPU.Tests.SkImageFinalizerRetirementTests.$method(useDawn: $backend)"
            }
            foreach ($kind in 0..3) {
              $expected += "ProGPU.Tests.SkImageFinalizerRetirementTests.AbandonedImageOwnershipQueuesWhileRenderLockIsHeld(useDawn: $backend, ownerKind: $kind)"
            }
          }
          $actual = @($trx.TestRun.Results.UnitTestResult)
          if ($actual.Count -ne 14 -or @($actual | Where-Object outcome -ne 'Passed').Count -ne 0) { throw 'Unexpected original outcomes.' }
          if (@(Compare-Object ($expected | Sort-Object) ($actual.testName | Sort-Object)).Count -ne 0) { throw 'Original case inventory differs.' }
          @{ source = 'aef75180bcdc3b937d004b6b949e0e91724c7981'; producer = 38549555561;
             sourceSha256 = $sourceHash; originalCollectorDeadlineSeconds = 5; processDeadlineSeconds = 180;
             executed = 14; passed = 14; skipped = 0; started = $started; completed = [DateTimeOffset]::UtcNow;
             originalTestBodyUnchanged = $true; originalWindowsCiRuntimeAndSdkPolicy = $true;
             historicalLinuxFailureAttributed = $false; packageOrApplicationQualification = $false } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $out 'receipt.json')
          Get-Content (Join-Path $out 'receipt.json')

      - name: Retain original logs and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retained-image-finalizer-windows-${{ github.run_id }}
          path: artifacts/windows-image-finalizer/
          if-no-files-found: error

# Temporary validation branch only. The default branch's normal Build is unchanged.
name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: original64-corrected-source-${{ github.sha }}
  cancel-in-progress: false
jobs:
  original-unhinted64-x64:
    if: github.ref == 'refs/heads/validate/unfitted-source-2e9e43495'
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      UNHINTED64_RUNNER_LABEL: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.403'
      - name: Require reviewed whole corrected producer before download
        id: producer
        shell: pwsh
        run: python eng/TemporaryCurrentUnfittedReplay/stage.py preflight
      - name: Retrieve the exact corrected producer package artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.producer.outputs.artifact_id }}
          run-id: 41974319569
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original64-standalone-package-artifact
          merge-multiple: true
          digest-mismatch: error
      - name: Build unchanged original source workloads from the isolated verified package feed
        shell: pwsh
        run: python eng/TemporaryCurrentUnfittedReplay/stage.py build
      - name: Capture each original provider once within unchanged bounds
        shell: pwsh
        run: python eng/TemporaryCurrentUnfittedReplay/run.py --closure "$env:RUNNER_TEMP/original64-standalone-stage/closure.json"
      - name: Retain original receipts and captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corrected-original64-source-evidence
          path: |
            ${{ runner.temp }}/original64-standalone-stage/evidence/
            ${{ runner.temp }}/original64-standalone-stage/closure.json
            ${{ runner.temp }}/original64-standalone-results/
          if-no-files-found: error
          retention-days: 14

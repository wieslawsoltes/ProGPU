# Temporary diagnostic branch only; never merge this workflow replacement.
name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-arm64-managed-shader-pair:
    if: github.ref == 'refs/heads/diagnose/managed-arm64-shader-pair'
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13388020604
          run-id: 41961661131
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/binary-shader-artifact
          merge-multiple: true
          digest-mismatch: error
      - name: Compare exact shaders with original managed fixtures and pinned DXC WARP
        shell: pwsh
        run: python eng/TemporaryBinaryShaderPair/run.py
      - name: Retain original process and payload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: managed-arm64-shader-pair
          path: ${{ runner.temp }}/binary-shader-pair/evidence/
          if-no-files-found: error
          retention-days: 14

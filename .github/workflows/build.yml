name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.head.sha || github.sha }}
  # LibreWPF stages native runtimes by exact ProGPU commit. Preserve every
  # artifact-producing run so frequent PR checkpoints cannot invalidate its
  # downstream package gate while that run is still compiling.
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROGPU_QUALIFIED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  native-cpp-browser:
    name: Native C++ browser WebGPU
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.18
          actions-cache-folder: artifacts/emsdk-cache

      - name: Build and test native browser renderer
        shell: bash
        env:
          PROGPU_NATIVE_BROWSER_INSTALL_CHROMIUM: 1
        run: ./eng/progpu-test-native-browser.sh

      - name: Upload native browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-browser-webgpu
          path: |
            artifacts/progpu-native/browser-evidence/progpu-native-browser-webgpu.png
            artifacts/progpu-native/browser-evidence/progpu-native-browser-contract.json
            artifacts/progpu-native/browser-evidence/progpu-native-browser-gallery.png
            artifacts/progpu-native/browser-evidence/progpu-native-browser-gallery.json
          if-no-files-found: warn

  native-cpp:
    name: Native C++ renderer (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-26
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache Windows native dependencies
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
            artifacts/wgpu-native-src
            artifacts/webgpu-headers-dawn
          key: progpu-native-windows-v2-${{ matrix.rid }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'src/ProGPU.Backend.Native/ProGPU.Backend.Native.csproj') }}

      - name: Verify generated C# native contract
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: ./eng/progpu-verify-native-contract.sh

      - name: Install Linux WebGPU dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh \
            clang \
            clang-tools \
            cmake \
            ninja-build \
            libvulkan1 \
            mesa-vulkan-drivers \
            libx11-xcb1 \
            libxcb1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-present0 \
            libxkbcommon0

      - name: Install macOS native build tools
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build and integration-test native renderer
        if: runner.os != 'Windows'
        shell: bash
        env:
          PROGPU_NATIVE_RUN_SANITIZERS: ${{ matrix.rid == 'linux-x64' && '1' || '0' }}
          PROGPU_NATIVE_RUN_DAWN_HEADER_CONTRACT: 1
          PROGPU_NATIVE_ENABLE_CPP_MODULES: ${{ matrix.rid == 'linux-x64' && 'ON' || '' }}
        run: |
          ./eng/build-progpu-native.sh
          ./eng/progpu-stage-native-runtime.sh

      - name: Build and integration-test native renderer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./eng/build-progpu-native-windows.ps1
          -Rid "${{ matrix.rid }}"
          -BenchmarkProfile Smoke

      - name: Capture pinned Microsoft DirectX sample oracles
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          ./eng/progpu-capture-directx-sample-oracle.ps1 -Platform x64 -Sample HelloTriangle -UseWarp
          ./eng/progpu-capture-directx-sample-oracle.ps1 -Platform x64 -Sample HelloTexture -UseWarp

      - name: Upload DirectX sample differential evidence
        if: matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64' || matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-directx-oracle-${{ matrix.rid }}
          path: artifacts/progpu-native/directx-oracle
          if-no-files-found: error

      - name: Upload portable Win2D Canvas evidence
        if: matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64' || matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-win2d-canvas-${{ matrix.rid }}
          path: artifacts/progpu-native/win2d-oracle
          if-no-files-found: error

      - name: Upload portable Direct2D WebGPU evidence
        if: matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64' || matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-direct2d-webgpu-${{ matrix.rid }}
          path: artifacts/progpu-native/direct2d-oracle
          if-no-files-found: error

      - name: Verify exact WebScene provider on Metal
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: ./eng/progpu-verify-native-webscene-provider.sh

      - name: Upload WebScene provider hardware evidence
        if: matrix.rid == 'osx-arm64'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-webscene-provider-osx-arm64
          path: |
            artifacts/progpu-native/sample/progpu-native-webscene-provider.ppm
            artifacts/progpu-native/sample/progpu-native-webscene-provider.png
            artifacts/progpu-native/sample/progpu-native-webscene-provider.txt
            artifacts/progpu-native/sample/progpu-native-managed-dawn.ppm
            artifacts/progpu-native/sample/progpu-native-managed-dawn.png
          if-no-files-found: error

      - name: Upload native backend execution evidence
        if: matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64' || matrix.rid == 'osx-x64' || matrix.rid == 'osx-arm64' || matrix.rid == 'win-x64' || matrix.rid == 'win-arm64'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-backend-${{ matrix.rid }}
          path: |
            artifacts/progpu-native/sample/progpu-native-sample.ppm
            artifacts/progpu-native/sample/progpu-native-provider.txt
          if-no-files-found: error

      - name: Upload native runtime
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-runtime-${{ matrix.rid }}
          path: artifacts/progpu-native/package
          if-no-files-found: error

      - name: Upload native symbols
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-symbols-${{ matrix.rid }}
          path: artifacts/progpu-native/symbols/${{ matrix.rid }}
          if-no-files-found: warn

  native-directx-sample-oracle:
    name: DirectX sample oracle (D3D12/Metal/Vulkan)
    needs: native-cpp
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}

      - name: Download platform oracle frames
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-directx-oracle-*
          path: artifacts/progpu-native/directx-oracle
          merge-multiple: true

      - name: Compare native D3D12 with ProGPU D3D12, Metal, and Vulkan
        shell: bash
        run: |
          python3 eng/progpu-compare-directx-sample-oracle.py \
            --reference artifacts/progpu-native/directx-oracle/windows-native/microsoft-d3d12-hello-triangle.ppm \
            --candidate artifacts/progpu-native/directx-oracle/progpu-d3d12.ppm \
            --candidate artifacts/progpu-native/directx-oracle/progpu-metal.ppm \
            --candidate artifacts/progpu-native/directx-oracle/progpu-vulkan.ppm \
            --output artifacts/progpu-native/directx-oracle/directx-sample-differential.json
          python3 eng/progpu-compare-directx-sample-oracle.py \
            --contract "Microsoft D3D12HelloTexture native-to-ProGPU differential" \
            --reference artifacts/progpu-native/directx-oracle/windows-native/microsoft-d3d12-hello-texture.ppm \
            --candidate artifacts/progpu-native/directx-oracle/progpu-hello-texture-d3d12.ppm \
            --candidate artifacts/progpu-native/directx-oracle/progpu-hello-texture-metal.ppm \
            --candidate artifacts/progpu-native/directx-oracle/progpu-hello-texture-vulkan.ppm \
            --output artifacts/progpu-native/directx-oracle/directx-hello-texture-differential.json

      - name: Upload DirectX cross-platform differential
        uses: actions/upload-artifact@v7
        with:
          name: progpu-directx-sample-differential
          path: artifacts/progpu-native/directx-oracle
          if-no-files-found: error

  native-win2d-canvas-parity:
    name: Win2D Canvas parity (D3D12/Metal/Vulkan)
    needs: native-cpp
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}

      - name: Download portable Canvas frames
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-win2d-canvas-*
          path: artifacts/progpu-native/win2d-oracle
          merge-multiple: true

      - name: Compare D3D12, Metal, and Vulkan Canvas frames
        shell: bash
        run: |
          python3 eng/progpu-compare-win2d-canvas.py \
            --reference artifacts/progpu-native/win2d-oracle/progpu-win2d-d3d12.ppm \
            --candidate artifacts/progpu-native/win2d-oracle/progpu-win2d-metal.ppm \
            --candidate artifacts/progpu-native/win2d-oracle/progpu-win2d-vulkan.ppm \
            --output artifacts/progpu-native/win2d-oracle/win2d-canvas-differential.json

      - name: Upload Win2D Canvas differential
        uses: actions/upload-artifact@v7
        with:
          name: progpu-win2d-canvas-differential
          path: artifacts/progpu-native/win2d-oracle
          if-no-files-found: error

  native-direct2d-webgpu-parity:
    name: Portable Direct2D COM parity (D3D12/Metal/Vulkan)
    needs: native-cpp
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}

      - name: Download portable Direct2D frames
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-direct2d-webgpu-*
          path: artifacts/progpu-native/direct2d-oracle
          merge-multiple: true

      - name: Compare D3D12, Metal, and Vulkan Direct2D frames
        shell: bash
        run: |
          python3 eng/progpu-compare-direct2d-webgpu.py \
            --reference artifacts/progpu-native/direct2d-oracle/progpu-direct2d-d3d12.ppm \
            --candidate artifacts/progpu-native/direct2d-oracle/progpu-direct2d-metal.ppm \
            --candidate artifacts/progpu-native/direct2d-oracle/progpu-direct2d-vulkan.ppm \
            --output artifacts/progpu-native/direct2d-oracle/direct2d-webgpu-differential.json

      - name: Upload portable Direct2D differential
        uses: actions/upload-artifact@v7
        with:
          name: progpu-direct2d-webgpu-differential
          path: artifacts/progpu-native/direct2d-oracle
          if-no-files-found: error

  native-cpp-compiler-compat:
    name: Native C++20 compiler compatibility (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: GCC
          - os: windows-latest
            compiler: MSVC

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache MSVC qualification dependencies
        if: matrix.compiler == 'MSVC'
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
            artifacts/wgpu-native-src
          key: progpu-native-msvc-v2-${{ hashFiles('global.json', 'Directory.Packages.props', 'src/ProGPU.Backend.Native/ProGPU.Backend.Native.csproj') }}

      - name: Install GCC compatibility dependencies
        if: matrix.compiler == 'GCC'
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh \
            cmake \
            g++ \
            ninja-build \
            libvulkan1 \
            mesa-vulkan-drivers \
            libx11-xcb1 \
            libxcb1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-present0 \
            libxkbcommon0

      - name: Compile and test with GCC C++20
        if: matrix.compiler == 'GCC'
        shell: bash
        env:
          PROGPU_NATIVE_CXX_COMPILER: g++
          PROGPU_NATIVE_ENABLE_CPP_MODULES: OFF
          PROGPU_NATIVE_SKIP_EXTENDED_INTEGRATION: 1
        run: ./eng/build-progpu-native.sh

      - name: Compile and test with Visual Studio MSVC C++20
        if: matrix.compiler == 'MSVC'
        shell: pwsh
        run: >-
          ./eng/build-progpu-native-windows.ps1
          -Rid win-x64
          -Compiler MSVC
          -SkipExtendedIntegration

  native-package:
    name: Native C++ NuGet package
    needs: native-cpp
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Linux WebGPU dependencies
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh libvulkan1 mesa-vulkan-drivers

      - name: Download native runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-native-runtime-*
          path: artifacts/progpu-native/package
          merge-multiple: true

      - name: Pack and run source-independent consumer
        shell: bash
        run: |
          version="0.1.0-preview.${GITHUB_RUN_NUMBER}.ci"
          echo "PROGPU_NATIVE_CI_VERSION=${version}" >> "${GITHUB_ENV}"
          output="${GITHUB_WORKSPACE}/artifacts/packages-native/Release"
          dotnet pack src/ProGPU.Backend/ProGPU.Backend.csproj \
            --configuration Release --output "${output}" \
            -p:Version="${version}" -p:PackageVersion="${version}"
          dotnet pack src/ProGPU.Backend.Dawn/ProGPU.Backend.Dawn.csproj \
            --configuration Release --output "${output}" \
            -p:Version="${version}" -p:PackageVersion="${version}"
          dotnet pack src/ProGPU.Backend.Native/ProGPU.Backend.Native.csproj \
            --configuration Release --output "${output}" \
            -p:Version="${version}" -p:PackageVersion="${version}"
          PROGPU_PACKAGE_VERSION="${version}" \
          PROGPU_PACKAGE_OUTPUT="${output}" \
            ./eng/progpu-verify-native-package.sh

      - name: Upload native NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-package
          path: |
            artifacts/packages-native/Release/*.nupkg
            artifacts/packages-native/Release/*.snupkg
          if-no-files-found: error

  native-package-consumer:
    name: Native package consumer (${{ matrix.rid }})
    needs: native-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-26
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Linux WebGPU dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh libvulkan1 mesa-vulkan-drivers

      - name: Download native NuGet package
        uses: actions/download-artifact@v8
        with:
          name: progpu-native-package
          path: artifacts/packages-native/Release

      - name: Restore and run package consumer
        shell: bash
        run: |
          version="0.1.0-preview.${GITHUB_RUN_NUMBER}.ci"
          broad_scene_args=()
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then
            # Microsoft Basic Render Driver can spend more than a minute in
            # the broad retained seed and then lose/blank the software device.
            # Keep full dual-export compilation here; the bounded retained
            # scenes below retain JIT GPU execution coverage on this RID.
            broad_scene_args=(--mil-only)
          fi
          dotnet restore tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}"
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}" -- \
            "${broad_scene_args[@]}"
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}" -- \
            --mil-drawing-group-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}" -- \
            --mil-glyph-run-drawing-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}" -- \
            --mil-text-render-options-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}" -- \
            --mil-visual-clip-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}" -- \
            --mil-visual-opacity-mask-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}" -- \
            --mil-visual-effect-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}" -- \
            --mil-visual-guideline-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}" -- \
            --mil-drawing-image-only
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-build \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}" -- \
            --mil-guideline-only

      - name: Publish and run NativeAOT package consumer
        shell: bash
        run: |
          version="0.1.0-preview.${GITHUB_RUN_NUMBER}.ci"
          broad_scene_args=()
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then
            broad_scene_args=(--mil-only)
          fi
          output="${GITHUB_WORKSPACE}/artifacts/progpu-native/package-consumer-aot/${{ matrix.rid }}"
          dotnet publish tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            --output "${output}" \
            -p:PublishAot=true \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}"
          executable="${output}/ProGPU.Native.PackageConsumer"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            executable="${executable}.exe"
          fi
          test -x "${executable}"
          "${executable}" "${broad_scene_args[@]}"
          "${executable}" --mil-drawing-group-only
          "${executable}" --mil-glyph-run-drawing-only
          "${executable}" --mil-text-render-options-only
          "${executable}" --mil-visual-clip-only
          "${executable}" --mil-visual-opacity-mask-only
          "${executable}" --mil-visual-effect-only
          "${executable}" --mil-visual-guideline-only
          "${executable}" --mil-drawing-image-only
          "${executable}" --mil-guideline-only

  avalonia-compositor-contract:
    name: Avalonia retained compositor contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run pinned Avalonia retained compositor contracts
        shell: bash
        run: ./tools/test-avalonia-progpu-compositor.sh

  avalonia-text-contract:
    name: Avalonia upstream text contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run pinned Avalonia text corpus with ProGPU shaping
        shell: bash
        run: ./tools/test-avalonia-progpu-text.sh

  avalonia-native-dawn-contract:
    name: Avalonia native Dawn contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Linux X11 and Vulkan software adapter
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh \
            libc++1 \
            libvulkan1 \
            mesa-vulkan-drivers \
            libx11-6 \
            libxi6 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-present0 \
            libxkbcommon0 \
            xvfb

      - name: Prepare pinned Avalonia source
        shell: bash
        run: ./tools/prepare-avalonia-12.1.1-source.sh

      - name: Build Dawn-compatible AvaloniaNative
        if: runner.os == 'macOS'
        shell: bash
        run: ./tools/build-avalonia-native-dawn.sh

      - name: Build native-window ControlCatalog and contracts
        shell: bash
        run: |
          dotnet restore integration/AvaloniaSourceControlCatalog/AvaloniaSourceControlCatalog.csproj \
            --configfile "${{ github.workspace }}/.worktrees/avalonia-12.1.1/NuGet.Config" \
            -p:ProGpuAvaloniaSourceRoot="${{ github.workspace }}/.worktrees/avalonia-12.1.1" \
            -p:ProGpuSourceRoot="${{ github.workspace }}" \
            -p:UseSkiaSharpShim=true
          dotnet build integration/AvaloniaSourceControlCatalog/AvaloniaSourceControlCatalog.csproj \
            --configuration Release \
            --no-restore \
            -m:1 \
            -p:ContinuousIntegrationBuild=true \
            -p:ProGpuAvaloniaSourceRoot="${{ github.workspace }}/.worktrees/avalonia-12.1.1" \
            -p:ProGpuSourceRoot="${{ github.workspace }}" \
            -p:UseSkiaSharpShim=true
          dotnet restore tests/ProGPU.Avalonia.ContractTests/ProGPU.Avalonia.ContractTests.csproj
          dotnet test tests/ProGPU.Avalonia.ContractTests/ProGPU.Avalonia.ContractTests.csproj \
            --configuration Release \
            --no-restore \
            -m:1 \
            --filter "FullyQualifiedName~DawnNativeWindowSourceTests"
          dotnet build tools/ProGPU.SampleMemoryProfiler/ProGPU.SampleMemoryProfiler.csproj \
            --configuration Release
          dotnet build integration/AvaloniaSilkNetInputHarness/AvaloniaSilkNetInputHarness.csproj \
            --configuration Release

      - name: Run X11 Vulkan ControlCatalog telemetry smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          PROGPU_AVALONIA_SKIP_BUILD: 1
          PROGPU_AVALONIA_BACKENDS: source-progpu-native
          PROGPU_AVALONIA_PAGE_FILTER: ^(Border|Canvas|ScrollViewer|TextBlock|Viewbox)$
          PROGPU_AVALONIA_WARMUP_FRAMES: 5
          PROGPU_AVALONIA_MEASURE_FRAMES: 10
          PROGPU_AVALONIA_SCREENSHOTS: 1
          PROGPU_AVALONIA_LAYOUT_CLIP_FIXTURE: 1
          PROGPU_AVALONIA_GEOMETRY_CLIP_FIXTURE: 1
          PROGPU_AVALONIA_BITMAP_CACHE_FIXTURE: 1
          PROGPU_AVALONIA_EFFECT_FIXTURE: 1
          PROGPU_AVALONIA_OPACITY_MASK_FIXTURE: 1
          PROGPU_AVALONIA_INHERITED_DRAWING_OPTIONS_FIXTURE: 1
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          xvfb-run -a \
            ./tools/profile-avalonia-controlcatalog.sh \
            artifacts/avalonia-native-dawn-linux
          xvfb-run -a env \
            PROGPU_AVALONIA_PAGE_FILTER='^AdornerLayer$' \
            PROGPU_AVALONIA_LAYOUT_CLIP_FIXTURE=0 \
            PROGPU_AVALONIA_GEOMETRY_CLIP_FIXTURE=0 \
            PROGPU_AVALONIA_BITMAP_CACHE_FIXTURE=0 \
            PROGPU_AVALONIA_EFFECT_FIXTURE=0 \
            PROGPU_AVALONIA_OPACITY_MASK_FIXTURE=0 \
            PROGPU_AVALONIA_INHERITED_DRAWING_OPTIONS_FIXTURE=0 \
            PROGPU_AVALONIA_TOPOLOGY_FIXTURE=0 \
            PROGPU_AVALONIA_ADORNER_FIXTURE=1 \
            ./tools/profile-avalonia-controlcatalog.sh \
            artifacts/avalonia-native-dawn-linux-adorner

      - name: Run macOS Metal ControlCatalog telemetry smoke
        if: runner.os == 'macOS'
        shell: bash
        env:
          PROGPU_AVALONIA_SKIP_BUILD: 1
          PROGPU_AVALONIA_BACKENDS: source-progpu-native
          PROGPU_AVALONIA_PAGE_FILTER: ^(Border|Canvas|ScrollViewer|TextBlock|Viewbox)$
          PROGPU_AVALONIA_WARMUP_FRAMES: 5
          PROGPU_AVALONIA_MEASURE_FRAMES: 10
          PROGPU_AVALONIA_SCREENSHOTS: 1
          PROGPU_AVALONIA_LAYOUT_CLIP_FIXTURE: 1
          PROGPU_AVALONIA_GEOMETRY_CLIP_FIXTURE: 1
          PROGPU_AVALONIA_BITMAP_CACHE_FIXTURE: 1
          PROGPU_AVALONIA_EFFECT_FIXTURE: 1
          PROGPU_AVALONIA_OPACITY_MASK_FIXTURE: 1
          PROGPU_AVALONIA_INHERITED_DRAWING_OPTIONS_FIXTURE: 1
        run: |
          ./tools/profile-avalonia-controlcatalog.sh \
            artifacts/avalonia-native-dawn-macos
          env \
            PROGPU_AVALONIA_PAGE_FILTER='^AdornerLayer$' \
            PROGPU_AVALONIA_LAYOUT_CLIP_FIXTURE=0 \
            PROGPU_AVALONIA_GEOMETRY_CLIP_FIXTURE=0 \
            PROGPU_AVALONIA_BITMAP_CACHE_FIXTURE=0 \
            PROGPU_AVALONIA_EFFECT_FIXTURE=0 \
            PROGPU_AVALONIA_OPACITY_MASK_FIXTURE=0 \
            PROGPU_AVALONIA_INHERITED_DRAWING_OPTIONS_FIXTURE=0 \
            PROGPU_AVALONIA_TOPOLOGY_FIXTURE=0 \
            PROGPU_AVALONIA_ADORNER_FIXTURE=1 \
            ./tools/profile-avalonia-controlcatalog.sh \
            artifacts/avalonia-native-dawn-macos-adorner

      - name: Run Win32 D3D12 ControlCatalog telemetry smoke
        if: runner.os == 'Windows'
        shell: bash
        env:
          PROGPU_AVALONIA_SKIP_BUILD: 1
          PROGPU_AVALONIA_BACKENDS: source-progpu-native
          PROGPU_AVALONIA_PAGE_FILTER: ^(Border|Canvas|ScrollViewer|TextBlock|Viewbox)$
          PROGPU_AVALONIA_WARMUP_FRAMES: 5
          PROGPU_AVALONIA_MEASURE_FRAMES: 10
          # Windows visual captures run in the interactive Parallels lane. A
          # service-desktop RenderTargetBitmap readback can block indefinitely
          # after valid D3D12/HWND telemetry on GitHub-hosted Windows runners.
          PROGPU_AVALONIA_SCREENSHOTS: 0
          PROGPU_AVALONIA_LAYOUT_CLIP_FIXTURE: 1
          PROGPU_AVALONIA_GEOMETRY_CLIP_FIXTURE: 1
          PROGPU_AVALONIA_BITMAP_CACHE_FIXTURE: 1
          PROGPU_AVALONIA_EFFECT_FIXTURE: 1
          PROGPU_AVALONIA_OPACITY_MASK_FIXTURE: 1
          PROGPU_AVALONIA_INHERITED_DRAWING_OPTIONS_FIXTURE: 1
        run: |
          ./tools/profile-avalonia-controlcatalog.sh \
            artifacts/avalonia-native-dawn-windows
          env \
            PROGPU_AVALONIA_PAGE_FILTER='^AdornerLayer$' \
            PROGPU_AVALONIA_LAYOUT_CLIP_FIXTURE=0 \
            PROGPU_AVALONIA_GEOMETRY_CLIP_FIXTURE=0 \
            PROGPU_AVALONIA_BITMAP_CACHE_FIXTURE=0 \
            PROGPU_AVALONIA_EFFECT_FIXTURE=0 \
            PROGPU_AVALONIA_OPACITY_MASK_FIXTURE=0 \
            PROGPU_AVALONIA_INHERITED_DRAWING_OPTIONS_FIXTURE=0 \
            PROGPU_AVALONIA_TOPOLOGY_FIXTURE=0 \
            PROGPU_AVALONIA_ADORNER_FIXTURE=1 \
            ./tools/profile-avalonia-controlcatalog.sh \
            artifacts/avalonia-native-dawn-windows-adorner

      - name: Run WebGPU device-loss recovery ControlCatalog smoke
        shell: bash
        env:
          PROGPU_AVALONIA_SKIP_BUILD: 1
          PROGPU_AVALONIA_BACKENDS: source-progpu,source-progpu-native
          PROGPU_AVALONIA_PAGE_FILTER: ^Border$
          PROGPU_AVALONIA_WARMUP_FRAMES: 5
          PROGPU_AVALONIA_MEASURE_FRAMES: 10
          PROGPU_AVALONIA_SCREENSHOTS: 0
          PROGPU_AVALONIA_FORCE_DEVICE_LOSS: 1
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            xvfb-run -a \
              ./tools/profile-avalonia-controlcatalog.sh \
              artifacts/avalonia-device-loss-recovery
          else
            ./tools/profile-avalonia-controlcatalog.sh \
              artifacts/avalonia-device-loss-recovery
          fi

      - name: Upload Linux native Dawn telemetry
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: avalonia-native-dawn-linux
          path: |
            artifacts/avalonia-native-dawn-linux
            artifacts/avalonia-native-dawn-linux-adorner
          if-no-files-found: warn

      - name: Upload macOS native Dawn telemetry
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v7
        with:
          name: avalonia-native-dawn-macos
          path: |
            artifacts/avalonia-native-dawn-macos
            artifacts/avalonia-native-dawn-macos-adorner
          if-no-files-found: warn

      - name: Upload Windows native Dawn telemetry
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v7
        with:
          name: avalonia-native-dawn-windows
          path: |
            artifacts/avalonia-native-dawn-windows
            artifacts/avalonia-native-dawn-windows-adorner
          if-no-files-found: warn

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            native_output: src/ProGPU.Tests/bin/Release/net10.0/linux-x64
          - os: macos-26
            rid: osx-arm64
            native_output: src/ProGPU.Tests/bin/Release/net10.0/osx-arm64
          - os: windows-latest
            rid: win-x64
            native_output: src/ProGPU.Tests/bin/Release/net10.0/win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
          submodules: recursive

      - name: Install Linux WebGPU dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh \
            libvulkan1 \
            mesa-vulkan-drivers \
            libx11-xcb1 \
            libxcb1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-present0 \
            libxkbcommon0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore src/ProGPU.Tests/ProGPU.Tests.csproj --runtime ${{ matrix.rid }}
          dotnet restore src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj --runtime ${{ matrix.rid }}

      - name: Build tests
        run: |
          dotnet build src/ProGPU.Tests/ProGPU.Tests.csproj --configuration Release --runtime ${{ matrix.rid }} --no-restore -p:ContinuousIntegrationBuild=true
          dotnet build src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj --configuration Release --runtime ${{ matrix.rid }} --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        shell: pwsh
        # Allocation contracts measure optimized steady-state hot paths. Avoid
        # crossing a tiered-compilation threshold inside a measured loop.
        env:
          DOTNET_TieredCompilation: "0"
        run: |
          $nativeRoot = Join-Path $env:GITHUB_WORKSPACE "${{ matrix.native_output }}"
          $nativeRidRoot = Join-Path $nativeRoot "runtimes/${{ matrix.rid }}/native"
          $headlessNativeRoot = Join-Path $env:GITHUB_WORKSPACE "src/ProGPU.Tests.Headless/bin/Release/net10.0/${{ matrix.rid }}"
          $headlessNativeRidRoot = Join-Path $headlessNativeRoot "runtimes/${{ matrix.rid }}/native"
          if ($IsWindows) {
            $env:PATH = "$nativeRoot;$nativeRidRoot;$headlessNativeRoot;$headlessNativeRidRoot;$env:PATH"
          } elseif ($IsMacOS) {
            $env:DYLD_LIBRARY_PATH = "$nativeRoot`:$nativeRidRoot`:$headlessNativeRoot`:$headlessNativeRidRoot`:$env:DYLD_LIBRARY_PATH"
          } else {
            $env:LD_LIBRARY_PATH = "$nativeRoot`:$nativeRidRoot`:$headlessNativeRoot`:$headlessNativeRidRoot`:$env:LD_LIBRARY_PATH"
          }

          $testArgs = @(
            "test",
            "src/ProGPU.Tests/ProGPU.Tests.csproj",
            "--configuration",
            "Release",
            "--runtime",
            "${{ matrix.rid }}",
            "--no-build",
            "--verbosity",
            "normal"
          )

          if ($IsWindows) {
            $testArgs += @(
              "--filter",
              "FullyQualifiedName~DiagnosticsLoggingSourceTests|FullyQualifiedName~StrongNameSigningTests|FullyQualifiedName~WindowsDpiAwarenessTests"
            )
          } elseif ($IsMacOS) {
            # macOS 26's hosted Metal compiler rejects the historical contextual
            # OpenType entry point even when its WGSL is restored byte-for-byte.
            # Keep all other core and headless macOS coverage. Software D3D12 and
            # Vulkan do not complete this compiler-heavy suite in a practical CI
            # time, so the complete contract remains a local hardware validation.
            $testArgs += @(
              "--filter",
              "FullyQualifiedName!~ShapingContractsTests"
            )
          } elseif ($IsLinux) {
            # The shaping contract suite repeatedly initializes and dispatches GPU
            # pipelines; under Mesa software execution it dominates this lane. The
            # complete contract remains a local hardware validation, while Linux
            # keeps the remaining core tests and all headless render coverage.
            $testArgs += @(
              "--filter",
              "FullyQualifiedName!~ShapingContractsTests"
            )
          }

          dotnet @testArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $headlessArgs = @(
            "test",
            "src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj",
            "--configuration",
            "Release",
            "--runtime",
            "${{ matrix.rid }}",
            "--no-build",
            "--verbosity",
            "normal"
          )

          if ($IsWindows) {
            # Keep native WebGPU lifetime bounded on the hosted Windows runner.
            # Sample pages share one retained headless device, while ordinary headless,
            # image effects, ShaderToy, and the large multilingual specimen each get a
            # fresh process. Image effects creates the largest transient texture graph.
            $headlessArgs += @(
              "--filter",
              "FullyQualifiedName!~SamplePagesTests"
            )
          }

          dotnet @headlessArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if ($IsWindows) {
            dotnet test `
              src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj `
              --configuration Release `
              --runtime "${{ matrix.rid }}" `
              --no-build `
              --verbosity normal `
              --filter "FullyQualifiedName~SamplePagesTests&FullyQualifiedName!~ShaderToy&FullyQualifiedName!~ImageEffects&FullyQualifiedName!~Test_TypographyScriptsPage_Renders"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            dotnet test `
              src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj `
              --configuration Release `
              --runtime "${{ matrix.rid }}" `
              --no-build `
              --verbosity normal `
              --filter "FullyQualifiedName~SamplePagesTests.Test_ImageEffectsPage_Renders"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            dotnet test `
              src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj `
              --configuration Release `
              --runtime "${{ matrix.rid }}" `
              --no-build `
              --verbosity normal `
              --filter "FullyQualifiedName~SamplePagesTests&FullyQualifiedName~ShaderToy"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            dotnet test `
              src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj `
              --configuration Release `
              --runtime "${{ matrix.rid }}" `
              --no-build `
              --verbosity normal `
              --filter "FullyQualifiedName=ProGPU.Tests.Headless.SamplePagesTests.Test_TypographyScriptsPage_Renders"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

  pack:
    name: Pack portable packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: native-cpp

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download native runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-native-runtime-*
          path: artifacts/progpu-native/package
          merge-multiple: true

      - name: Pack shipping packages
        shell: bash
        run: PROGPU_PACKAGE_GROUP=portable PROGPU_PACKAGE_VERSION=0.1.0-preview.${{ github.run_number }}.ci ./eng/progpu-pack.sh

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: progpu-packages-linux-x64
          path: |
            artifacts/packages/Release/*.nupkg
            artifacts/packages/Release/*.snupkg
          if-no-files-found: error

  pack-mobile:
    name: Pack mobile packages
    runs-on: macos-26
    # The provider-resolved Android+iOS cross-build alone can exceed 45
    # minutes on a cold hosted runner. Leave enough budget for workload
    # restore, package verification, and artifact upload after compilation.
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android NDK
        shell: bash
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "${GITHUB_ENV}"

      - name: Build provider-resolved mobile C++ renderer
        shell: bash
        run: ./eng/build-progpu-native-mobile.sh all

      - name: Restore mobile workloads
        run: |
          dotnet workload restore src/ProGPU.Android/ProGPU.Android.csproj --skip-manifest-update
          dotnet workload restore src/ProGPU.iOS/ProGPU.iOS.csproj --skip-manifest-update

      - name: Pack mobile packages
        shell: bash
        run: |
          PROGPU_PACKAGE_GROUP=mobile \
          PROGPU_PACKAGE_VERSION=0.1.0-preview.${{ github.run_number }}.ci \
          PROGPU_PACKAGE_OUTPUT=artifacts/packages-mobile/Release \
            ./eng/progpu-pack.sh
          PROGPU_PACKAGE_VERSION=0.1.0-preview.${{ github.run_number }}.ci \
          PROGPU_PACKAGE_OUTPUT=artifacts/packages-mobile/Release \
            ./eng/progpu-verify-native-mobile-package.sh

      - name: Upload mobile C++ renderer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-mobile
          path: artifacts/progpu-native/mobile
          if-no-files-found: error

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: progpu-packages-mobile
          path: |
            artifacts/packages-mobile/Release/*.nupkg
            artifacts/packages-mobile/Release/*.snupkg
          if-no-files-found: error

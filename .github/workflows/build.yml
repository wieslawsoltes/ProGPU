# Temporary branch only; default-branch Build and release gates remain unchanged.
name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  arm64-first-native-fault:
    if: github.ref == 'refs/heads/diagnose/d0-arm64-binary-crash'
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      ORIGINAL: ${{ github.workspace }}/original
      CAPTURE_OUTPUT: ${{ github.workspace }}/evidence
      EXECUTION: ${{ github.workspace }}/execution
      PROGPU_HIT_TEST_EXECUTION: ordered-stages
      PROGPU_DX12_SHADER_COMPILER: dxc
      PROGPU_BACKEND_DIAGNOSTICS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: d0d5e9e0c2cfd15e880b0e0259b2a1e2f1d45f43
          path: original
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13383649446
          run-id: 41954219105
          github-token: ${{ github.token }}
          path: original/artifacts/packages-native/Release
          merge-multiple: true
          digest-mismatch: error
      - name: Verify failed package and exact unchanged source
        shell: pwsh
        run: python diagnostic/eng/TemporaryArm64Crash/stage.py preflight
      - name: Prepare original pinned framework sources
        shell: bash
        working-directory: original
        run: python3 eng/progpu-prepare-framework-sources.py
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: original/global.json
      - name: Compile unchanged original package consumer
        shell: pwsh
        working-directory: original
        run: |
          dotnet build tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj `
            --configuration Release --runtime win-arm64 `
            -p:ProGpuUseDx12Runtime=true `
            -p:ProGpuNativePackageSource="$env:ORIGINAL/artifacts/packages-native/Release" `
            -p:ProGpuNativePackageVersion=0.1.0-preview.3701.ci 2>&1 |
            Tee-Object -FilePath "$env:CAPTURE_OUTPUT/consumer-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Freeze actual execution closure and installed WARP identity
        shell: pwsh
        run: python diagnostic/eng/TemporaryArm64Crash/stage.py stage
      - name: Prepare signed native debugger and independent CPU control
        shell: pwsh
        run: ./diagnostic/eng/TemporaryArm64Crash/prepare-tools.ps1 -Control FirstChanceControl
      - name: Verify handled native exception continues and final fail-fast is retained
        shell: pwsh
        run: python diagnostic/eng/TemporaryArm64Crash/cdb_first_chance.py control
      - name: Observe first native faults in the unchanged original glyph workload
        shell: pwsh
        run: python diagnostic/eng/TemporaryArm64Crash/cdb_first_chance.py workload
      - name: Retain diagnostic receipts and original failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d0-arm64-first-native-fault
          path: evidence/
          if-no-files-found: error
          retention-days: 14

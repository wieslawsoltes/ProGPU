name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.head.sha || github.sha }}
  # LibreWPF stages native runtimes by exact ProGPU commit. Preserve every
  # artifact-producing run so frequent PR checkpoints cannot invalidate its
  # downstream package gate while that run is still compiling.
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROGPU_QUALIFIED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  system-drawing-contract:
    name: System.Drawing API, quality, and performance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install software WebGPU adapter
        shell: bash
        run: |
          ./eng/progpu-install-linux-packages.sh \
            libvulkan1 \
            mesa-vulkan-drivers

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify pinned API contract
        shell: bash
        run: ./eng/progpu-verify-system-drawing-api.sh

      - name: Run focused quality and allocation gates
        run: dotnet test src/System.Drawing.Common.Tests/System.Drawing.Common.Tests.csproj --configuration Release --verbosity normal

      - name: Run pinned official System.Drawing behavior corpus
        shell: bash
        run: ./eng/progpu-verify-upstream-system-drawing-tests.sh

      - name: Capture System.Drawing microbenchmarks
        run: >-
          dotnet run
          --project src/System.Drawing.Common.Benchmarks/System.Drawing.Common.Benchmarks.csproj
          --configuration Release
          --
          --job short
          --filter '*'
          --exporters json

      - name: Upload API, behavior-corpus, and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: progpu-system-drawing-contract
          path: |
            artifacts/system-drawing-api-compat/current.txt
            artifacts/system-drawing-upstream/results/*
            BenchmarkDotNet.Artifacts/results/*
          if-no-files-found: warn

  native-cpp-browser:
    name: Native C++ browser WebGPU
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.18
          actions-cache-folder: artifacts/emsdk-cache

      - name: Build and test native browser renderer
        shell: bash
        env:
          PROGPU_NATIVE_BROWSER_INSTALL_CHROMIUM: 1
        run: ./eng/progpu-test-native-browser.sh

      - name: Pack and exercise installed npm browser library
        shell: bash
        run: |
          node eng/progpu-pack-npm.mjs
          node eng/progpu-test-npm-browser.mjs

      - name: Upload verified npm package
        uses: actions/upload-artifact@v7
        with:
          name: progpu-npm-package
          path: |
            artifacts/npm/*.tgz
            artifacts/npm/npm-artifact.json
          if-no-files-found: error

      - name: Upload npm browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: progpu-npm-browser-evidence
          path: artifacts/npm/evidence/
          if-no-files-found: warn

      - name: Upload native browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-browser-webgpu
          path: |
            artifacts/progpu-native/browser-evidence/progpu-native-browser-webgpu.png
            artifacts/progpu-native/browser-evidence/progpu-native-browser-contract.json
            artifacts/progpu-native/browser-evidence/progpu-native-browser-timeout.json
            artifacts/progpu-native/browser-evidence/progpu-native-browser-gallery.png
            artifacts/progpu-native/browser-evidence/progpu-native-browser-gallery.json
          if-no-files-found: warn

  dx12-runtime:
    name: Windows compiler runtime (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Cache pinned compiler dependency build
        uses: actions/cache@v5
        with:
          path: artifacts/wgpu-native-windows/${{ matrix.rid }}
          key: progpu-dx12-${{ matrix.rid }}-${{ hashFiles('eng/wgpu-dxc/**', 'eng/progpu-native-wgpu.version.json', 'eng/build-wgpu-native-windows.ps1') }}
      - name: Build and verify Windows runtime payload
        shell: pwsh
        run: |
          ./eng/test-dx12-runtime-inputs.ps1
          foreach ($rid in @('win-x64', 'win-arm64', 'linux-x64')) {
            dotnet msbuild eng/test-dx12-package-targets.proj -p:RuntimeIdentifier=$rid -nologo
            if ($LASTEXITCODE -ne 0) { throw 'DX12 package asset selection failed.' }
          }
          ./eng/build-progpu-dx12-runtime-windows.ps1 -Rid '${{ matrix.rid }}'
      - name: Upload Windows runtime payload
        uses: actions/upload-artifact@v7
        with:
          name: progpu-dx12-runtime-${{ matrix.rid }}
          path: artifacts/progpu-dx12/package
          if-no-files-found: error

  native-cpp:
    name: Native C++ renderer (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PROGPU_NATIVE_MIL_IMAGE_BRUSH_CAPTURE_DIR: ${{ github.workspace }}/artifacts/progpu-native/image-brush-oracle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-26
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify Windows compiler dependency input handling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./eng/test-wgpu-native-windows-inputs.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native compiler build input checks failed.' }
          ./eng/test-dxc-compiler-inputs.ps1

      - name: Stage pinned redistributable Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pin = Get-Content -Raw eng/wgpu-dxc/compiler-package.json | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP "Microsoft.Direct3D.DXC.$($pin.version).nupkg"
          Invoke-WebRequest -Uri $pin.url -OutFile $archive
          ./eng/stage-dxc-compiler.ps1 -Rid '${{ matrix.rid }}' -PackagePath $archive -OutputDirectory 'artifacts/dxc-compiler/${{ matrix.rid }}'

      - name: Upload verified Windows compiler artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-dxc-compiler-${{ matrix.rid }}
          path: artifacts/dxc-compiler/${{ matrix.rid }}
          if-no-files-found: error

      - name: Cache Windows native dependencies
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
            artifacts/wgpu-native-src
            artifacts/webgpu-headers-dawn
          key: progpu-native-windows-v2-${{ matrix.rid }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'src/ProGPU.Backend.Native/ProGPU.Backend.Native.csproj') }}

      - name: Verify generated C# native contract
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: ./eng/progpu-verify-native-contract.sh

      - name: Install Linux WebGPU dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh \
            clang \
            clang-tools \
            cmake \
            ninja-build \
            libvulkan1 \
            mesa-vulkan-drivers \
            libx11-xcb1 \
            libxcb1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-present0 \
            libxkbcommon0

      - name: Install macOS native build tools
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build and integration-test native renderer
        if: runner.os != 'Windows'
        shell: bash
        env:
          PROGPU_NATIVE_RUN_SANITIZERS: ${{ matrix.rid == 'linux-x64' && '1' || '0' }}
          PROGPU_NATIVE_RUN_DAWN_HEADER_CONTRACT: 1
          PROGPU_NATIVE_ENABLE_CPP_MODULES: ${{ matrix.rid == 'linux-x64' && 'ON' || '' }}
        run: |
          ./eng/build-progpu-native.sh
          ./eng/progpu-stage-native-runtime.sh

      - name: Build and integration-test native renderer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./eng/build-progpu-native-windows.ps1
          -Rid "${{ matrix.rid }}"
          -BenchmarkProfile Smoke

      - name: Upload native MIL ImageBrush frames
        if: matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64' || matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-mil-image-brush-${{ matrix.rid }}
          path: artifacts/progpu-native/image-brush-oracle
          if-no-files-found: error

      - name: Capture pinned Microsoft DirectX sample oracles
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          ./eng/progpu-capture-directx-sample-oracle.ps1 -Platform x64 -Sample HelloTriangle -UseWarp
          ./eng/progpu-capture-directx-sample-oracle.ps1 -Platform x64 -Sample HelloTexture -UseWarp

      - name: Upload DirectX sample differential evidence
        if: matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64' || matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-directx-oracle-${{ matrix.rid }}
          path: artifacts/progpu-native/directx-oracle
          if-no-files-found: error

      - name: Upload portable Win2D Canvas evidence
        if: matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64' || matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-win2d-canvas-${{ matrix.rid }}
          path: artifacts/progpu-native/win2d-oracle
          if-no-files-found: error

      - name: Upload portable Direct2D WebGPU evidence
        if: matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64' || matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-direct2d-webgpu-${{ matrix.rid }}
          path: artifacts/progpu-native/direct2d-oracle
          if-no-files-found: error

      - name: Verify exact WebScene provider on Metal
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: ./eng/progpu-verify-native-webscene-provider.sh

      - name: Upload WebScene provider hardware evidence
        if: matrix.rid == 'osx-arm64'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-webscene-provider-osx-arm64
          path: |
            artifacts/progpu-native/sample/progpu-native-webscene-provider.ppm
            artifacts/progpu-native/sample/progpu-native-webscene-provider.png
            artifacts/progpu-native/sample/progpu-native-webscene-provider.txt
            artifacts/progpu-native/sample/progpu-native-managed-dawn.ppm
            artifacts/progpu-native/sample/progpu-native-managed-dawn.png
          if-no-files-found: error

      - name: Upload native backend execution evidence
        if: matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64' || matrix.rid == 'osx-x64' || matrix.rid == 'osx-arm64' || matrix.rid == 'win-x64' || matrix.rid == 'win-arm64'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-backend-${{ matrix.rid }}
          path: |
            artifacts/progpu-native/sample/progpu-native-sample.ppm
            artifacts/progpu-native/sample/progpu-native-provider.txt
          if-no-files-found: error

      - name: Upload native runtime
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-runtime-${{ matrix.rid }}
          path: artifacts/progpu-native/package
          if-no-files-found: error

      - name: Upload native symbols
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-symbols-${{ matrix.rid }}
          path: artifacts/progpu-native/symbols/${{ matrix.rid }}
          if-no-files-found: warn

  native-directx-sample-oracle:
    name: DirectX sample oracle (D3D12/Metal/Vulkan)
    needs: native-cpp
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}

      - name: Download platform oracle frames
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-directx-oracle-*
          path: artifacts/progpu-native/directx-oracle
          merge-multiple: true

      - name: Compare native D3D12 with ProGPU D3D12, Metal, and Vulkan
        shell: bash
        run: |
          python3 eng/progpu-compare-directx-sample-oracle.py \
            --reference artifacts/progpu-native/directx-oracle/windows-native/microsoft-d3d12-hello-triangle.ppm \
            --candidate artifacts/progpu-native/directx-oracle/progpu-d3d12.ppm \
            --candidate artifacts/progpu-native/directx-oracle/progpu-metal.ppm \
            --candidate artifacts/progpu-native/directx-oracle/progpu-vulkan.ppm \
            --output artifacts/progpu-native/directx-oracle/directx-sample-differential.json
          python3 eng/progpu-compare-directx-sample-oracle.py \
            --contract "Microsoft D3D12HelloTexture native-to-ProGPU differential" \
            --reference artifacts/progpu-native/directx-oracle/windows-native/microsoft-d3d12-hello-texture.ppm \
            --candidate artifacts/progpu-native/directx-oracle/progpu-hello-texture-d3d12.ppm \
            --candidate artifacts/progpu-native/directx-oracle/progpu-hello-texture-metal.ppm \
            --candidate artifacts/progpu-native/directx-oracle/progpu-hello-texture-vulkan.ppm \
            --output artifacts/progpu-native/directx-oracle/directx-hello-texture-differential.json

      - name: Upload DirectX cross-platform differential
        uses: actions/upload-artifact@v7
        with:
          name: progpu-directx-sample-differential
          path: artifacts/progpu-native/directx-oracle
          if-no-files-found: error

  native-win2d-canvas-parity:
    name: Win2D Canvas parity (D3D12/Metal/Vulkan)
    needs: native-cpp
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}

      - name: Download portable Canvas frames
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-win2d-canvas-*
          path: artifacts/progpu-native/win2d-oracle
          merge-multiple: true

      - name: Compare D3D12, Metal, and Vulkan Canvas frames
        shell: bash
        run: |
          python3 eng/progpu-compare-win2d-canvas.py \
            --reference artifacts/progpu-native/win2d-oracle/progpu-win2d-d3d12.ppm \
            --candidate artifacts/progpu-native/win2d-oracle/progpu-win2d-metal.ppm \
            --candidate artifacts/progpu-native/win2d-oracle/progpu-win2d-vulkan.ppm \
            --output artifacts/progpu-native/win2d-oracle/win2d-canvas-differential.json

      - name: Upload Win2D Canvas differential
        uses: actions/upload-artifact@v7
        with:
          name: progpu-win2d-canvas-differential
          path: artifacts/progpu-native/win2d-oracle
          if-no-files-found: error

  native-mil-image-brush-parity:
    name: Native MIL ImageBrush versus Windows WPF (D3D12/Metal/Vulkan)
    needs: native-cpp
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
      - uses: actions/download-artifact@v8
        with:
          pattern: progpu-mil-image-brush-*
          path: artifacts/image-brush-inputs
      - name: Compare every captured pixel against native WPF
        shell: pwsh
        run: |
          foreach ($rid in @('linux-x64', 'osx-arm64', 'win-x64')) {
            powershell.exe -NoProfile -Sta -File eng/mil/progpu-wpf-image-brush-oracle.ps1 `
              -ProGpuCaptureDirectory "artifacts/image-brush-inputs/progpu-mil-image-brush-$rid" `
              -OutputDirectory "artifacts/image-brush-wpf/$rid"
            if ($LASTEXITCODE -ne 0) { throw "Native WPF ImageBrush comparison failed: $rid" }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: progpu-mil-image-brush-wpf-differential
          path: artifacts/image-brush-wpf
          if-no-files-found: error

  native-direct2d-webgpu-parity:
    name: Portable Direct2D COM parity (D3D12/Metal/Vulkan)
    needs: native-cpp
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}

      - name: Download portable Direct2D frames
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-direct2d-webgpu-*
          path: artifacts/progpu-native/direct2d-oracle
          merge-multiple: true

      - name: Compare D3D12, Metal, and Vulkan Direct2D frames
        shell: bash
        run: |
          python3 eng/progpu-compare-direct2d-webgpu.py \
            --reference artifacts/progpu-native/direct2d-oracle/progpu-direct2d-d3d12.ppm \
            --candidate artifacts/progpu-native/direct2d-oracle/progpu-direct2d-metal.ppm \
            --candidate artifacts/progpu-native/direct2d-oracle/progpu-direct2d-vulkan.ppm \
            --output artifacts/progpu-native/direct2d-oracle/direct2d-webgpu-differential.json

      - name: Upload portable Direct2D differential
        uses: actions/upload-artifact@v7
        with:
          name: progpu-direct2d-webgpu-differential
          path: artifacts/progpu-native/direct2d-oracle
          if-no-files-found: error

  native-cpp-compiler-compat:
    name: Native C++20 compiler compatibility (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: GCC
          - os: windows-latest
            compiler: MSVC

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache MSVC qualification dependencies
        if: matrix.compiler == 'MSVC'
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
            artifacts/wgpu-native-src
          key: progpu-native-msvc-v2-${{ hashFiles('global.json', 'Directory.Packages.props', 'src/ProGPU.Backend.Native/ProGPU.Backend.Native.csproj') }}

      - name: Install GCC compatibility dependencies
        if: matrix.compiler == 'GCC'
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh \
            cmake \
            g++ \
            ninja-build \
            libvulkan1 \
            mesa-vulkan-drivers \
            libx11-xcb1 \
            libxcb1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-present0 \
            libxkbcommon0

      - name: Compile and test with GCC C++20
        if: matrix.compiler == 'GCC'
        shell: bash
        env:
          PROGPU_NATIVE_CXX_COMPILER: g++
          PROGPU_NATIVE_ENABLE_CPP_MODULES: OFF
          PROGPU_NATIVE_SKIP_EXTENDED_INTEGRATION: 1
        run: ./eng/build-progpu-native.sh

      - name: Compile and test with Visual Studio MSVC C++20
        if: matrix.compiler == 'MSVC'
        shell: pwsh
        run: >-
          ./eng/build-progpu-native-windows.ps1
          -Rid win-x64
          -Compiler MSVC
          -SkipExtendedIntegration

  native-package:
    name: Native C++ NuGet package
    needs: [native-cpp, dx12-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Linux WebGPU dependencies
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh libvulkan1 mesa-vulkan-drivers

      - name: Download native runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-native-runtime-*
          path: artifacts/progpu-native/package
          merge-multiple: true

      - name: Download Windows compiler runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-dx12-runtime-*
          path: artifacts/progpu-dx12/package
          merge-multiple: true

      - name: Pack and run source-independent consumer
        shell: bash
        run: |
          version="0.1.0-preview.${GITHUB_RUN_NUMBER}.ci"
          echo "PROGPU_NATIVE_CI_VERSION=${version}" >> "${GITHUB_ENV}"
          output="${GITHUB_WORKSPACE}/artifacts/packages-native/Release"
          dotnet pack src/ProGPU.Backend/ProGPU.Backend.csproj \
            --configuration Release --output "${output}" \
            -p:Version="${version}" -p:PackageVersion="${version}"
          dotnet pack src/ProGPU.Backend.Dawn/ProGPU.Backend.Dawn.csproj \
            --configuration Release --output "${output}" \
            -p:Version="${version}" -p:PackageVersion="${version}"
          dotnet pack src/ProGPU.Backend.Native/ProGPU.Backend.Native.csproj \
            --configuration Release --output "${output}" \
            -p:Version="${version}" -p:PackageVersion="${version}"
          dotnet pack src/ProGPU.Backend.Dx12/ProGPU.Backend.Dx12.csproj \
            --configuration Release --output "${output}" \
            -p:Version="${version}" -p:PackageVersion="${version}"
          PROGPU_PACKAGE_VERSION="${version}" \
          PROGPU_PACKAGE_OUTPUT="${output}" \
            ./eng/progpu-verify-native-package.sh

      - name: Upload native NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-package
          path: |
            artifacts/packages-native/Release/*.nupkg
            artifacts/packages-native/Release/*.snupkg
          if-no-files-found: error

  native-dx12-package-consumer:
    name: Native DX12 package consumer (${{ matrix.rid }})
    needs: native-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    env:
      PROGPU_HIT_TEST_EXECUTION: ordered-stages
      PROGPU_DX12_SHADER_COMPILER: dxc
      PROGPU_BACKEND_DIAGNOSTICS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: progpu-native-package
          path: artifacts/packages-native/Release
      - name: Run full packaged system-WARP consumer
        shell: pwsh
        run: |
          $version = "0.1.0-preview.$env:GITHUB_RUN_NUMBER.ci"
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj `
            --configuration Release --runtime '${{ matrix.rid }}' `
            -p:ProGpuUseDx12Runtime=true `
            -p:ProGpuNativePackageSource="$env:GITHUB_WORKSPACE/artifacts/packages-native/Release" `
            -p:ProGpuNativePackageVersion="$version" -- --software-adapter
          if ($LASTEXITCODE -ne 0) { throw 'Full DX12 package consumer failed.' }
      - name: Publish and run full NativeAOT system-WARP consumer
        shell: pwsh
        run: |
          $version = "0.1.0-preview.$env:GITHUB_RUN_NUMBER.ci"
          $output = "$env:GITHUB_WORKSPACE/artifacts/dx12-consumer-aot"
          dotnet publish tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj `
            --configuration Release --runtime '${{ matrix.rid }}' -p:PublishAot=true `
            -p:ProGpuUseDx12Runtime=true --output $output `
            -p:ProGpuNativePackageSource="$env:GITHUB_WORKSPACE/artifacts/packages-native/Release" `
            -p:ProGpuNativePackageVersion="$version"
          if ($LASTEXITCODE -ne 0) { throw 'DX12 NativeAOT publication failed.' }
          & "$output/ProGPU.Native.PackageConsumer.exe" --software-adapter
          if ($LASTEXITCODE -ne 0) { throw 'Full DX12 NativeAOT consumer failed.' }

  native-package-consumer:
    name: ${{ matrix.name }}
    needs: native-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            suite: all
            name: Native package consumer (linux-x64)
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            suite: all
            name: Native package consumer (linux-arm64)
          - os: macos-15-intel
            rid: osx-x64
            suite: all
            name: Native package consumer (osx-x64)
          - os: macos-26
            rid: osx-arm64
            suite: all
            name: Native package consumer (osx-arm64)
          - os: windows-latest
            rid: win-x64
            suite: core
            name: Native package consumer (win-x64)
          - os: windows-11-arm
            rid: win-arm64
            suite: core
            name: Native package consumer (win-arm64)
          # Serial cold Windows consumers exceed the job bound even when all
          # assertions pass. Keep all JIT/AOT processes, split independent cases.
          - os: windows-latest
            rid: win-x64
            suite: drawings
            name: Native package drawings (win-x64)
          - os: windows-latest
            rid: win-x64
            suite: visuals
            name: Native package visuals (win-x64)
          - os: windows-latest
            rid: win-x64
            suite: guidelines
            name: Native package guidelines (win-x64)
          - os: windows-11-arm
            rid: win-arm64
            suite: drawings
            name: Native package drawings (win-arm64)
          - os: windows-11-arm
            rid: win-arm64
            suite: visuals
            name: Native package visuals (win-arm64)
          - os: windows-11-arm
            rid: win-arm64
            suite: guidelines
            name: Native package guidelines (win-arm64)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Linux WebGPU dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh libvulkan1 mesa-vulkan-drivers

      - name: Download native NuGet package
        uses: actions/download-artifact@v8
        with:
          name: progpu-native-package
          path: artifacts/packages-native/Release

      - name: Run ordered-query native package consumer
        if: matrix.suite == 'all' || matrix.suite == 'core'
        shell: bash
        env:
          PROGPU_HIT_TEST_EXECUTION: ordered-stages
        run: |
          version="0.1.0-preview.${GITHUB_RUN_NUMBER}.ci"
          consumer_args=()
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            consumer_args=(--software-adapter)
          fi
          dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}" -- "${consumer_args[@]}"

      - name: Restore and run package consumer
        shell: bash
        run: |
          # macOS Bash 3 treats an empty argument array as unset under nounset.
          set -eo pipefail
          version="0.1.0-preview.${GITHUB_RUN_NUMBER}.ci"
          ./eng/progpu-verify-native-package-scenarios.sh
          scenarios="$(./eng/progpu-native-package-scenarios.sh '${{ matrix.suite }}')"
          dotnet restore tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}"
          dotnet build tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release --no-restore \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}"
          if [[ '${{ matrix.suite }}' == all || '${{ matrix.suite }}' == core ]]; then
            broad_scene_args=()
            if [[ '${{ matrix.rid }}' == win-x64 ]]; then
              # Preserve existing broad-scene admission; the ordered core run
              # above still renders the full seed on the Windows software adapter.
              broad_scene_args=(--mil-only)
            fi
            dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
              --configuration Release --no-build \
              -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
              -p:ProGpuNativePackageVersion="${version}" -- "${broad_scene_args[@]}"
          fi
          while IFS= read -r scenario; do
            [[ -n "${scenario}" ]] || continue
            echo "Independent JIT package scene: ${scenario}"
            dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
              --configuration Release --no-build \
              -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
              -p:ProGpuNativePackageVersion="${version}" -- "${scenario}"
          done <<< "${scenarios}"

      - name: Diagnose Windows path stages after consumer failure
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: |
          version="0.1.0-preview.${GITHUB_RUN_NUMBER}.ci"
          failed=0
          for probe in --path-coverage-probe --path-vector-probe --path-vector-batched-probe --path-native-layout-probe --path-native-bindings-probe --path-native-submit-probe --native-path-probe --native-cubic-probe; do
            echo "Independent current-package process: ${probe}"
            dotnet run --project tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
              --configuration Release --no-build \
              -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
              -p:ProGpuNativePackageVersion="${version}" -- "${probe}" || failed=1
          done
          exit "${failed}"

      - name: Publish and run NativeAOT package consumer
        shell: bash
        run: |
          version="0.1.0-preview.${GITHUB_RUN_NUMBER}.ci"
          broad_scene_args=()
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then
            broad_scene_args=(--mil-only)
          fi
          output="${GITHUB_WORKSPACE}/artifacts/progpu-native/package-consumer-aot/${{ matrix.rid }}"
          dotnet publish tests/ProGPU.Native.PackageConsumer/ProGPU.Native.PackageConsumer.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            --output "${output}" \
            -p:PublishAot=true \
            -p:ProGpuNativePackageSource="${GITHUB_WORKSPACE}/artifacts/packages-native/Release" \
            -p:ProGpuNativePackageVersion="${version}"
          executable="${output}/ProGPU.Native.PackageConsumer"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            executable="${executable}.exe"
          fi
          test -x "${executable}"
          scenarios="$(./eng/progpu-native-package-scenarios.sh '${{ matrix.suite }}')"
          if [[ '${{ matrix.suite }}' == all || '${{ matrix.suite }}' == core ]]; then
            "${executable}" "${broad_scene_args[@]}"
          fi
          while IFS= read -r scenario; do
            [[ -n "${scenario}" ]] || continue
            echo "Independent NativeAOT package scene: ${scenario}"
            "${executable}" "${scenario}"
          done <<< "${scenarios}"


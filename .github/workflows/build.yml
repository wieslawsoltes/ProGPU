# Temporary diagnostic branch only; close unmerged and delete after evidence retention.
name: Build
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-managed-arm64-first-fault:
    if: github.ref == 'refs/heads/diagnose/managed-arm64-first-fault'
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      PROGPU_HIT_TEST_EXECUTION: ordered-stages
      PROGPU_DX12_SHADER_COMPILER: dxc
      PROGPU_BACKEND_DIAGNOSTICS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13388020604
          run-id: 41961661131
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/binary-shader-artifact
          merge-multiple: true
          digest-mismatch: error
      - name: Build and freeze the exact original managed execution closure
        shell: cmd
        run: python eng/TemporaryArm64ManagedFault/build.py
      - name: Prepare signed native debugger and independent original CPU control
        shell: pwsh
        run: ./eng/TemporaryArm64ManagedFault/prepare-tools.ps1 -Control FirstChanceControl
      - name: Verify handled first chance and original final fail-fast behavior
        shell: cmd
        run: python eng/TemporaryArm64ManagedFault/cdb_first_chance.py control
      - name: Capture original managed shader first native fault
        shell: cmd
        run: python eng/TemporaryArm64ManagedFault/cdb_first_chance.py workload
      - name: Remove owned temporary compilation and tool downloads
        if: always()
        shell: cmd
        run: python eng/TemporaryArm64ManagedFault/cleanup.py
      - name: Preserve all original fault and process evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: managed-arm64-first-native-fault
          path: ${{ runner.temp }}/managed-arm64-first-fault/evidence/
          if-no-files-found: error
          retention-days: 14

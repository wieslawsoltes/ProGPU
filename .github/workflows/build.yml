  avalonia-native-dawn-contract:
    name: Avalonia native Dawn contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Linux X11 and Vulkan software adapter
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh \
            libc++1 \
            libvulkan1 \
            mesa-vulkan-drivers \
            libx11-6 \
            libxi6 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-present0 \
            libxkbcommon0 \
            xvfb

      - name: Prepare pinned Avalonia source
        shell: bash
        run: ./tools/prepare-avalonia-12.1.1-source.sh

      - name: Build Dawn-compatible AvaloniaNative
        if: runner.os == 'macOS'
        shell: bash
        run: ./tools/build-avalonia-native-dawn.sh

      - name: Build native-window ControlCatalog and contracts
        shell: bash
        run: |
          dotnet restore integration/AvaloniaSourceControlCatalog/AvaloniaSourceControlCatalog.csproj \
            --configfile "${{ github.workspace }}/.worktrees/avalonia-12.1.1/NuGet.Config" \
            -p:ProGpuAvaloniaSourceRoot="${{ github.workspace }}/.worktrees/avalonia-12.1.1" \
            -p:ProGpuSourceRoot="${{ github.workspace }}" \
            -p:UseSkiaSharpShim=true
          dotnet build integration/AvaloniaSourceControlCatalog/AvaloniaSourceControlCatalog.csproj \
            --configuration Release \
            --no-restore \
            -m:1 \
            -p:ContinuousIntegrationBuild=true \
            -p:ProGpuAvaloniaSourceRoot="${{ github.workspace }}/.worktrees/avalonia-12.1.1" \
            -p:ProGpuSourceRoot="${{ github.workspace }}" \
            -p:UseSkiaSharpShim=true
          dotnet restore tests/ProGPU.Avalonia.ContractTests/ProGPU.Avalonia.ContractTests.csproj
          dotnet test tests/ProGPU.Avalonia.ContractTests/ProGPU.Avalonia.ContractTests.csproj \
            --configuration Release \
            --no-restore \
            -m:1 \
            --filter "FullyQualifiedName~DawnNativeWindowSourceTests"
          dotnet build tools/ProGPU.SampleMemoryProfiler/ProGPU.SampleMemoryProfiler.csproj \
            --configuration Release
          dotnet build integration/AvaloniaSilkNetInputHarness/AvaloniaSilkNetInputHarness.csproj \
            --configuration Release

      - name: Run X11 Vulkan ControlCatalog telemetry smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          PROGPU_AVALONIA_SKIP_BUILD: 1
          PROGPU_AVALONIA_BACKENDS: source-progpu-native
          PROGPU_AVALONIA_PAGE_FILTER: ^(Border|Canvas|ScrollViewer|TextBlock|Viewbox)$
          PROGPU_AVALONIA_WARMUP_FRAMES: 5
          PROGPU_AVALONIA_MEASURE_FRAMES: 10
          PROGPU_AVALONIA_SCREENSHOTS: 1
          PROGPU_AVALONIA_LAYOUT_CLIP_FIXTURE: 1
          PROGPU_AVALONIA_GEOMETRY_CLIP_FIXTURE: 1
          PROGPU_AVALONIA_BITMAP_CACHE_FIXTURE: 1
          PROGPU_AVALONIA_EFFECT_FIXTURE: 1
          PROGPU_AVALONIA_OPACITY_MASK_FIXTURE: 1
          PROGPU_AVALONIA_INHERITED_DRAWING_OPTIONS_FIXTURE: 1
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          xvfb-run -a \
            ./tools/profile-avalonia-controlcatalog.sh \
            artifacts/avalonia-native-dawn-linux
          xvfb-run -a env \
            PROGPU_AVALONIA_PAGE_FILTER='^AdornerLayer$' \
            PROGPU_AVALONIA_LAYOUT_CLIP_FIXTURE=0 \
            PROGPU_AVALONIA_GEOMETRY_CLIP_FIXTURE=0 \
            PROGPU_AVALONIA_BITMAP_CACHE_FIXTURE=0 \
            PROGPU_AVALONIA_EFFECT_FIXTURE=0 \
            PROGPU_AVALONIA_OPACITY_MASK_FIXTURE=0 \
            PROGPU_AVALONIA_INHERITED_DRAWING_OPTIONS_FIXTURE=0 \
            PROGPU_AVALONIA_TOPOLOGY_FIXTURE=0 \
            PROGPU_AVALONIA_ADORNER_FIXTURE=1 \
            ./tools/profile-avalonia-controlcatalog.sh \
            artifacts/avalonia-native-dawn-linux-adorner

      - name: Run macOS Metal ControlCatalog telemetry smoke
        if: runner.os == 'macOS'
        shell: bash
        env:
          PROGPU_AVALONIA_SKIP_BUILD: 1
          PROGPU_AVALONIA_BACKENDS: source-progpu-native
          PROGPU_AVALONIA_PAGE_FILTER: ^(Border|Canvas|ScrollViewer|TextBlock|Viewbox)$
          PROGPU_AVALONIA_WARMUP_FRAMES: 5
          PROGPU_AVALONIA_MEASURE_FRAMES: 10
          PROGPU_AVALONIA_SCREENSHOTS: 1
          PROGPU_AVALONIA_LAYOUT_CLIP_FIXTURE: 1
          PROGPU_AVALONIA_GEOMETRY_CLIP_FIXTURE: 1
          PROGPU_AVALONIA_BITMAP_CACHE_FIXTURE: 1
          PROGPU_AVALONIA_EFFECT_FIXTURE: 1
          PROGPU_AVALONIA_OPACITY_MASK_FIXTURE: 1
          PROGPU_AVALONIA_INHERITED_DRAWING_OPTIONS_FIXTURE: 1
        run: |
          ./tools/profile-avalonia-controlcatalog.sh \
            artifacts/avalonia-native-dawn-macos
          env \
            PROGPU_AVALONIA_PAGE_FILTER='^AdornerLayer$' \
            PROGPU_AVALONIA_LAYOUT_CLIP_FIXTURE=0 \
            PROGPU_AVALONIA_GEOMETRY_CLIP_FIXTURE=0 \
            PROGPU_AVALONIA_BITMAP_CACHE_FIXTURE=0 \
            PROGPU_AVALONIA_EFFECT_FIXTURE=0 \
            PROGPU_AVALONIA_OPACITY_MASK_FIXTURE=0 \
            PROGPU_AVALONIA_INHERITED_DRAWING_OPTIONS_FIXTURE=0 \
            PROGPU_AVALONIA_TOPOLOGY_FIXTURE=0 \
            PROGPU_AVALONIA_ADORNER_FIXTURE=1 \
            ./tools/profile-avalonia-controlcatalog.sh \
            artifacts/avalonia-native-dawn-macos-adorner

      - name: Run Win32 D3D12 ControlCatalog telemetry smoke
        if: runner.os == 'Windows'
        shell: bash
        env:
          PROGPU_AVALONIA_SKIP_BUILD: 1
          PROGPU_AVALONIA_BACKENDS: source-progpu-native
          PROGPU_AVALONIA_PAGE_FILTER: ^(Border|Canvas|ScrollViewer|TextBlock|Viewbox)$
          PROGPU_AVALONIA_WARMUP_FRAMES: 5
          PROGPU_AVALONIA_MEASURE_FRAMES: 10
          # Windows visual captures run in the interactive Parallels lane. A
          # service-desktop RenderTargetBitmap readback can block indefinitely
          # after valid D3D12/HWND telemetry on GitHub-hosted Windows runners.
          PROGPU_AVALONIA_SCREENSHOTS: 0
          PROGPU_AVALONIA_LAYOUT_CLIP_FIXTURE: 1
          PROGPU_AVALONIA_GEOMETRY_CLIP_FIXTURE: 1
          PROGPU_AVALONIA_BITMAP_CACHE_FIXTURE: 1
          PROGPU_AVALONIA_EFFECT_FIXTURE: 1
          PROGPU_AVALONIA_OPACITY_MASK_FIXTURE: 1
          PROGPU_AVALONIA_INHERITED_DRAWING_OPTIONS_FIXTURE: 1
        run: |
          ./tools/profile-avalonia-controlcatalog.sh \
            artifacts/avalonia-native-dawn-windows
          env \
            PROGPU_AVALONIA_PAGE_FILTER='^AdornerLayer$' \
            PROGPU_AVALONIA_LAYOUT_CLIP_FIXTURE=0 \
            PROGPU_AVALONIA_GEOMETRY_CLIP_FIXTURE=0 \
            PROGPU_AVALONIA_BITMAP_CACHE_FIXTURE=0 \
            PROGPU_AVALONIA_EFFECT_FIXTURE=0 \
            PROGPU_AVALONIA_OPACITY_MASK_FIXTURE=0 \
            PROGPU_AVALONIA_INHERITED_DRAWING_OPTIONS_FIXTURE=0 \
            PROGPU_AVALONIA_TOPOLOGY_FIXTURE=0 \
            PROGPU_AVALONIA_ADORNER_FIXTURE=1 \
            ./tools/profile-avalonia-controlcatalog.sh \
            artifacts/avalonia-native-dawn-windows-adorner

      - name: Run WebGPU device-loss recovery ControlCatalog smoke
        shell: bash
        env:
          PROGPU_AVALONIA_SKIP_BUILD: 1
          PROGPU_AVALONIA_BACKENDS: source-progpu,source-progpu-native
          PROGPU_AVALONIA_PAGE_FILTER: ^Border$
          PROGPU_AVALONIA_WARMUP_FRAMES: 5
          PROGPU_AVALONIA_MEASURE_FRAMES: 10
          PROGPU_AVALONIA_SCREENSHOTS: 0
          PROGPU_AVALONIA_FORCE_DEVICE_LOSS: 1
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            xvfb-run -a \
              ./tools/profile-avalonia-controlcatalog.sh \
              artifacts/avalonia-device-loss-recovery
          else
            ./tools/profile-avalonia-controlcatalog.sh \
              artifacts/avalonia-device-loss-recovery
          fi

      - name: Upload Linux native Dawn telemetry
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: avalonia-native-dawn-linux
          path: |
            artifacts/avalonia-native-dawn-linux
            artifacts/avalonia-native-dawn-linux-adorner
          if-no-files-found: warn

      - name: Upload macOS native Dawn telemetry
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v7
        with:
          name: avalonia-native-dawn-macos
          path: |
            artifacts/avalonia-native-dawn-macos
            artifacts/avalonia-native-dawn-macos-adorner
          if-no-files-found: warn

      - name: Upload Windows native Dawn telemetry
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v7
        with:
          name: avalonia-native-dawn-windows
          path: |
            artifacts/avalonia-native-dawn-windows
            artifacts/avalonia-native-dawn-windows-adorner
          if-no-files-found: warn

  ordered-hit-query-windows:
    name: Ordered GPU query parity (${{ matrix.rid }})
    needs: [build-test, native-cpp]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    env:
      PROGPU_HIT_TEST_EXECUTION: ordered-stages
      PROGPU_BACKEND_DIAGNOSTICS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Download independent original-shader Metal reference
        uses: actions/download-artifact@v8
        with:
          name: progpu-ordered-hit-query-osx-arm64
          path: artifacts/query-reference
      - name: Download matching C++ runtime
        uses: actions/download-artifact@v8
        with:
          name: progpu-native-runtime-${{ matrix.rid }}
          path: artifacts/query-native
      - name: Compare managed and C++ queries on system WARP and default compiler
        shell: pwsh
        run: |
          dotnet build tests/ProGPU.HitQuery.ContractTests --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Query contract build failed.' }
          $output = Join-Path $env:GITHUB_WORKSPACE 'tests/ProGPU.HitQuery.ContractTests/bin/Release/net10.0'
          Copy-Item -LiteralPath "artifacts/query-native/runtimes/${{ matrix.rid }}/native/progpu_native.dll" -Destination $output
          dotnet run --project tests/ProGPU.HitQuery.ContractTests --configuration Release --no-build -- `
            --software-adapter --require-fxc --staged-only --product --native-product --sparse --large-capacity --admitted-index `
            --expected-results artifacts/query-reference/progpu-hit-query-native-reference.bin
          if ($LASTEXITCODE -ne 0) { throw 'System-WARP query parity failed.' }

      - name: Compare automatic FXC product selection with the independent reference
        shell: pwsh
        env:
          PROGPU_HIT_TEST_EXECUTION: auto
        run: |
          dotnet run --project tests/ProGPU.HitQuery.ContractTests --configuration Release --no-build -- `
            --software-adapter --require-automatic-fxc --staged-only --product --native-product --sparse --large-capacity --admitted-index `
            --expected-results artifacts/query-reference/progpu-hit-query-native-reference.bin
          if ($LASTEXITCODE -ne 0) { throw 'Automatic system-FXC query parity failed.' }

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            native_output: src/ProGPU.Tests/bin/Release/net10.0/linux-x64
          - os: macos-26
            rid: osx-arm64
            native_output: src/ProGPU.Tests/bin/Release/net10.0/osx-arm64
          - os: windows-latest
            rid: win-x64
            native_output: src/ProGPU.Tests/bin/Release/net10.0/win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
          submodules: recursive

      - name: Install Linux WebGPU dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          ./eng/progpu-install-linux-packages.sh \
            libvulkan1 \
            mesa-vulkan-drivers \
            libx11-xcb1 \
            libxcb1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-present0 \
            libxkbcommon0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore src/ProGPU.Tests/ProGPU.Tests.csproj --runtime ${{ matrix.rid }}
          dotnet restore src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj --runtime ${{ matrix.rid }}

      - name: Build tests
        run: |
          dotnet build src/ProGPU.Tests/ProGPU.Tests.csproj --configuration Release --runtime ${{ matrix.rid }} --no-restore -p:ContinuousIntegrationBuild=true
          dotnet build src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj --configuration Release --runtime ${{ matrix.rid }} --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run X11 popup server-state contracts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./eng/progpu-install-linux-packages.sh xvfb xauth libx11-6
          xvfb-run -a env PROGPU_NATIVE_X11_POPUP_TEST=1 \
            dotnet test src/ProGPU.Tests/ProGPU.Tests.csproj \
              --configuration Release --runtime ${{ matrix.rid }} --no-build \
              --filter "FullyQualifiedName~NativePopupWindowLinuxTests" \
              --logger "trx;LogFileName=native-x11-popup.trx" \
              --results-directory artifacts/native-x11-popup

      - name: Upload X11 popup server-state results
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: native-x11-popup-${{ matrix.rid }}
          path: artifacts/native-x11-popup
          if-no-files-found: warn

      - name: Verify browser indirect command transport
        run: node --experimental-vm-modules eng/progpu-test-browser-indirect-dispatch.mjs

      - name: Compare ordered GPU query stages with original shader
        if: runner.os != 'Windows'
        shell: bash
        env:
          PROGPU_HIT_TEST_EXECUTION: ordered-stages
        run: |
          git fetch --no-tags --depth=1 origin 20bbf7f1f65d15bc05b6e12e17d635ccaefa7162
          git show 20bbf7f1f65d15bc05b6e12e17d635ccaefa7162:src/ProGPU.Vector/Shaders/GpuHitTesting.wgsl > "$RUNNER_TEMP/progpu-hit-query-reference.wgsl"
          dotnet run --project tests/ProGPU.HitQuery.ContractTests --configuration Release -- \
            --product --reference-shader "$RUNNER_TEMP/progpu-hit-query-reference.wgsl" \
            --write-reference "$RUNNER_TEMP/progpu-hit-query-reference.bin"
          dotnet run --project tests/ProGPU.HitQuery.ContractTests --configuration Release --no-build -- \
            --product --sparse \
            --write-reference "$RUNNER_TEMP/progpu-hit-query-sparse-reference.bin"
          dotnet run --project tests/ProGPU.HitQuery.ContractTests --configuration Release --no-build -- \
            --product --sparse --large-capacity \
            --write-reference "$RUNNER_TEMP/progpu-hit-query-large-reference.bin"

      - name: Compare Dawn ordered GPU queries with the independent reference
        if: runner.os == 'macOS'
        shell: bash
        env:
          PROGPU_HIT_TEST_EXECUTION: ordered-stages
        run: |
          dotnet run --project tests/ProGPU.HitQuery.ContractTests --configuration Release --no-build -- \
            --dawn --product --reference-shader "$RUNNER_TEMP/progpu-hit-query-reference.wgsl" \
            --expected-results "$RUNNER_TEMP/progpu-hit-query-reference.bin"
          dotnet run --project tests/ProGPU.HitQuery.ContractTests --configuration Release --no-build -- \
            --dawn --product --sparse --reference-shader "$RUNNER_TEMP/progpu-hit-query-reference.wgsl" \
            --expected-results "$RUNNER_TEMP/progpu-hit-query-sparse-reference.bin"
          dotnet run --project tests/ProGPU.HitQuery.ContractTests --configuration Release --no-build -- \
            --dawn --product --sparse --large-capacity --reference-shader "$RUNNER_TEMP/progpu-hit-query-reference.wgsl" \
            --expected-results "$RUNNER_TEMP/progpu-hit-query-large-reference.bin"
          dotnet run --project tests/ProGPU.HitQuery.ContractTests --configuration Release --no-build -- \
            --dawn --product --sparse --large-capacity --admitted-index \
            --reference-shader "$RUNNER_TEMP/progpu-hit-query-reference.wgsl" \
            --write-reference "$RUNNER_TEMP/progpu-hit-query-native-reference.bin"

      - name: Upload ordered query reference
        if: runner.os != 'Windows' && always()
        uses: actions/upload-artifact@v7
        with:
          name: progpu-ordered-hit-query-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/progpu-hit-query-reference.wgsl
            ${{ runner.temp }}/progpu-hit-query-reference.bin
            ${{ runner.temp }}/progpu-hit-query-sparse-reference.bin
            ${{ runner.temp }}/progpu-hit-query-large-reference.bin
            ${{ runner.temp }}/progpu-hit-query-native-reference.bin
          if-no-files-found: warn

      - name: Test
        shell: pwsh
        # Allocation contracts measure optimized steady-state hot paths. Avoid
        # crossing a tiered-compilation threshold inside a measured loop.
        env:
          DOTNET_TieredCompilation: "0"
        run: |
          $nativeRoot = Join-Path $env:GITHUB_WORKSPACE "${{ matrix.native_output }}"
          $nativeRidRoot = Join-Path $nativeRoot "runtimes/${{ matrix.rid }}/native"
          $headlessNativeRoot = Join-Path $env:GITHUB_WORKSPACE "src/ProGPU.Tests.Headless/bin/Release/net10.0/${{ matrix.rid }}"
          $headlessNativeRidRoot = Join-Path $headlessNativeRoot "runtimes/${{ matrix.rid }}/native"
          if ($IsWindows) {
            $env:PATH = "$nativeRoot;$nativeRidRoot;$headlessNativeRoot;$headlessNativeRidRoot;$env:PATH"
          } elseif ($IsMacOS) {
            $env:DYLD_LIBRARY_PATH = "$nativeRoot`:$nativeRidRoot`:$headlessNativeRoot`:$headlessNativeRidRoot`:$env:DYLD_LIBRARY_PATH"
          } else {
            $env:LD_LIBRARY_PATH = "$nativeRoot`:$nativeRidRoot`:$headlessNativeRoot`:$headlessNativeRidRoot`:$env:LD_LIBRARY_PATH"
          }

          $testArgs = @(
            "test",
            "src/ProGPU.Tests/ProGPU.Tests.csproj",
            "--configuration",
            "Release",
            "--runtime",
            "${{ matrix.rid }}",
            "--no-build",
            "--verbosity",
            "normal"
          )

          if ($IsWindows) {
            $testArgs += @(
              "--filter",
              "FullyQualifiedName~DiagnosticsLoggingSourceTests|FullyQualifiedName~StrongNameSigningTests|FullyQualifiedName~WindowsDpiAwarenessTests"
            )
          } elseif ($IsMacOS) {
            # macOS 26's hosted Metal compiler rejects the historical contextual
            # OpenType entry point even when its WGSL is restored byte-for-byte.
            # Keep all other core and headless macOS coverage. Software D3D12 and
            # Vulkan do not complete this compiler-heavy suite in a practical CI
            # time, so the complete contract remains a local hardware validation.
            $testArgs += @(
              "--filter",
              "FullyQualifiedName!~ShapingContractsTests"
            )
          } elseif ($IsLinux) {
            # The shaping contract suite repeatedly initializes and dispatches GPU
            # pipelines; under Mesa software execution it dominates this lane. The
            # complete contract remains a local hardware validation, while Linux
            # keeps the remaining core tests and all headless render coverage.
            $testArgs += @(
              "--filter",
              "FullyQualifiedName!~ShapingContractsTests"
            )
          }

          dotnet @testArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $headlessArgs = @(
            "test",
            "src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj",
            "--configuration",
            "Release",
            "--runtime",
            "${{ matrix.rid }}",
            "--no-build",
            "--verbosity",
            "normal"
          )

          if ($IsWindows) {
            # Keep native WebGPU lifetime bounded on the hosted Windows runner.
            # Sample pages share one retained headless device, while ordinary headless,
            # image effects, ShaderToy, and the large multilingual specimen each get a
            # fresh process. Image effects creates the largest transient texture graph.
            $headlessArgs += @(
              "--filter",
              "FullyQualifiedName!~SamplePagesTests"
            )
          }

          dotnet @headlessArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if ($IsWindows) {
            dotnet test `
              src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj `
              --configuration Release `
              --runtime "${{ matrix.rid }}" `
              --no-build `
              --verbosity normal `
              --filter "FullyQualifiedName~SamplePagesTests&FullyQualifiedName!~ShaderToy&FullyQualifiedName!~ImageEffects&FullyQualifiedName!~Test_TypographyScriptsPage_Renders"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            dotnet test `
              src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj `
              --configuration Release `
              --runtime "${{ matrix.rid }}" `
              --no-build `
              --verbosity normal `
              --filter "FullyQualifiedName~SamplePagesTests.Test_ImageEffectsPage_Renders"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            dotnet test `
              src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj `
              --configuration Release `
              --runtime "${{ matrix.rid }}" `
              --no-build `
              --verbosity normal `
              --filter "FullyQualifiedName~SamplePagesTests&FullyQualifiedName~ShaderToy"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            dotnet test `
              src/ProGPU.Tests.Headless/ProGPU.Tests.Headless.csproj `
              --configuration Release `
              --runtime "${{ matrix.rid }}" `
              --no-build `
              --verbosity normal `
              --filter "FullyQualifiedName=ProGPU.Tests.Headless.SamplePagesTests.Test_TypographyScriptsPage_Renders"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

  pack:
    name: Pack portable packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [native-cpp, dx12-runtime]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download native runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-native-runtime-*
          path: artifacts/progpu-native/package
          merge-multiple: true

      - name: Download Windows compiler runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: progpu-dx12-runtime-*
          path: artifacts/progpu-dx12/package
          merge-multiple: true

      - name: Pack shipping packages
        shell: bash
        run: PROGPU_PACKAGE_GROUP=portable PROGPU_PACKAGE_VERSION=0.1.0-preview.${{ github.run_number }}.ci ./eng/progpu-pack.sh

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: progpu-packages-linux-x64
          path: |
            artifacts/packages/Release/*.nupkg
            artifacts/packages/Release/*.snupkg
          if-no-files-found: error

  pack-mobile:
    name: Pack mobile packages
    runs-on: macos-26
    # The provider-resolved Android+iOS cross-build alone can exceed 45
    # minutes on a cold hosted runner. Leave enough budget for workload
    # restore, package verification, and artifact upload after compilation.
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ env.PROGPU_QUALIFIED_COMMIT }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android NDK
        shell: bash
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "${GITHUB_ENV}"

      - name: Build provider-resolved mobile C++ renderer
        shell: bash
        run: ./eng/build-progpu-native-mobile.sh all

      - name: Restore mobile workloads
        run: |
          dotnet workload restore src/ProGPU.Android/ProGPU.Android.csproj --skip-manifest-update
          dotnet workload restore src/ProGPU.iOS/ProGPU.iOS.csproj --skip-manifest-update

      - name: Pack mobile packages
        shell: bash
        run: |
          PROGPU_PACKAGE_GROUP=mobile \
          PROGPU_PACKAGE_VERSION=0.1.0-preview.${{ github.run_number }}.ci \
          PROGPU_PACKAGE_OUTPUT=artifacts/packages-mobile/Release \
            ./eng/progpu-pack.sh
          PROGPU_PACKAGE_VERSION=0.1.0-preview.${{ github.run_number }}.ci \
          PROGPU_PACKAGE_OUTPUT=artifacts/packages-mobile/Release \
            ./eng/progpu-verify-native-mobile-package.sh

      - name: Upload mobile C++ renderer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: progpu-native-mobile
          path: artifacts/progpu-native/mobile
          if-no-files-found: error

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: progpu-packages-mobile
          path: |
            artifacts/packages-mobile/Release/*.nupkg
            artifacts/packages-mobile/Release/*.snupkg
          if-no-files-found: error

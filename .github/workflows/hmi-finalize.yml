name: Finalize HMI integration
on:
  push:
    branches: [feat/hmi-designer]
    paths: ['eng/hmi-finalize.py']
permissions:
  contents: read
jobs:
  source-fixes:
    if: github.repository == 'wieslawsoltes/ProGPU' && github.ref == 'refs/heads/feat/hmi-designer'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply exact-match source fixes
        run: python3 eng/hmi-finalize.py
      - name: Commit only HMI integration paths
        run: |
          git diff --check
          git add src/ProGPU.WinUI.Hmi src/ProGPU.WinUI.Hmi.Designer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(hmi): preserve locked z-order and clarify unknown process state'
          git push origin HEAD:refs/heads/feat/hmi-designer
      - name: Test the committed source
        run: dotnet test tests/ProGPU.Hmi.Tests/ProGPU.Hmi.Tests.csproj -c Release --logger "trx;LogFileName=hmi.trx" --results-directory artifacts/hmi/tests
      - name: Build standalone designer
        run: dotnet build samples/HmiDesigner/HmiDesigner.csproj -c Release
      - name: Build gallery
        run: dotnet build src/ProGPU.Samples/ProGPU.Samples.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hmi-integration-validation
          path: artifacts/hmi
          if-no-files-found: ignore

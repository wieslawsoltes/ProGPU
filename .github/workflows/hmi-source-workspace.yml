name: HMI source workspace
on:
  push:
    branches: [feat/hmi-designer]
    paths: ['.github/workflows/hmi-source-workspace.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source without credentials, generated outputs or fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/source
          git rev-parse HEAD > artifacts/source/commit.txt
          git ls-files -z | tar --null --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff*' --exclude='external/*' -T - -czf artifacts/source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hmi-source-workspace
          path: artifacts/source
          retention-days: 1

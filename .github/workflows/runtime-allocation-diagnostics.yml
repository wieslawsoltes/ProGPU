name: Runtime allocation diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  bounded-profile-repair:
    name: Exact-binary CPU pair and existing Metal exports
    runs-on: macos-26
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Complete bounded profiling evidence
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 eng/instruments-profile-repair.py
    - name: Retain profiling receipts and original control frames
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: crossing-profile-repair-receipts-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/crossing-profile-repair/*.json
          ${{ runner.temp }}/crossing-profile-repair/*.txt
          ${{ runner.temp }}/crossing-profile-repair/control-*
          ${{ runner.temp }}/crossing-profile-repair/metal-exports
        if-no-files-found: error
        retention-days: 7
    - name: Retain CPU captures
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: crossing-profile-repair-time-${{ github.run_id }}
        path: ${{ runner.temp }}/crossing-profile-repair/time-*
        if-no-files-found: warn
        retention-days: 7

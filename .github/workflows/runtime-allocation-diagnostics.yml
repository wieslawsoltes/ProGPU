name: Runtime allocation diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  matched-products:
    name: Original corpus packaged native comparison (${{ matrix.kind }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [time, memory, metal]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Profile exact whole-qualified products with the original workload
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_KIND: ${{ matrix.kind }}
        run: python3 eng/mask-products-profile.py
      - name: Retain original traces, tables, frames and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mask-products-${{ matrix.kind }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mask-products-${{ matrix.kind }}/*.json
            ${{ runner.temp }}/mask-products-${{ matrix.kind }}/control-*
            ${{ runner.temp }}/mask-products-${{ matrix.kind }}/${{ matrix.kind }}-*
          if-no-files-found: error
          retention-days: 7

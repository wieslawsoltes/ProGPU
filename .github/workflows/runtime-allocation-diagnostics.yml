name: Runtime allocation diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instruments-preflight:
    name: Hosted Instruments availability (diagnostic only)
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check Time Profiler, Allocations, VM Tracker and Metal
        run: python3 eng/instruments-hosted-preflight.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instruments-hosted-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/instruments-preflight
          if-no-files-found: error
          retention-days: 7

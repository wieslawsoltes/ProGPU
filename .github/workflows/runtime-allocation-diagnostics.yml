name: Runtime allocation diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  remaining-instruments:
    name: Matched ${{ matrix.kind }} ${{ matrix.order }} (diagnostic only)
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kind: [memory, metal]
        order: [AB, BA]
    env:
      GH_TOKEN: ${{ github.token }}
      CAPTURE_KIND: ${{ matrix.kind }}
      CAPTURE_ORDER: ${{ matrix.order }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture missing matched profiles from verified original binaries
        run: python3 eng/instruments-hosted-remaining.py
      - name: Retain original receipts, tables and trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-instruments-${{ matrix.kind }}-${{ matrix.order }}-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/remaining-instruments/receipt.json
            ${{ runner.temp }}/remaining-instruments/whole-producer.json
            ${{ runner.temp }}/remaining-instruments/control-*/**
            ${{ runner.temp }}/remaining-instruments/memory-*/**
            ${{ runner.temp }}/remaining-instruments/metal-*/**

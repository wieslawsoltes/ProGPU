name: Runtime allocation diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  first-launch:
    name: Original WebScene pipeline call attribution
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trace the first original workload launch and one subsequent reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/webscene-pipeline-observer-diagnostic.py
      - name: Retain every original result and trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webscene-pipeline-observer-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/webscene-pipeline-observer/*.json
            ${{ runner.temp }}/webscene-pipeline-observer/first-launch
            ${{ runner.temp }}/webscene-pipeline-observer/subsequent-reference
          if-no-files-found: error
          retention-days: 7

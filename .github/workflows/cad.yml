name: CAD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cad-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: CAD tests and browser AOT rendering
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Linux WebGPU dependencies
        run: >-
          ./eng/progpu-install-linux-packages.sh
          libvulkan1 mesa-vulkan-drivers libx11-xcb1 libxcb1
          libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-shm0
          libxcb-xfixes0 libxcb-present0 libxkbcommon0
      - name: Test CAD document and scene contracts
        env:
          DOTNET_TieredCompilation: "0"
          LD_LIBRARY_PATH: ${{ github.workspace }}/src/ProGPU.CAD.Tests/bin/Release/net10.0/linux-x64:${{ github.workspace }}/src/ProGPU.CAD.Tests/bin/Release/net10.0/linux-x64/runtimes/linux-x64/native
        run: dotnet test src/ProGPU.CAD.Tests/ProGPU.CAD.Tests.csproj -c Release --runtime linux-x64
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish CAD with AOT and native linking
        run: >-
          dotnet publish src/ProGPU.CAD.Sample.Browser/ProGPU.CAD.Sample.Browser.csproj
          -c Release -p:ProGpuForkPackage=true -p:RunAOTCompilation=true
      - name: Install browser test runner
        run: |
          npm ci --prefix src/ProGPU.Native/browser
          npx --prefix src/ProGPU.Native/browser playwright install --with-deps chromium
      - name: Exercise published CAD browser
        env:
          PROGPU_CAD_BROWSER_USE_SWIFTSHADER: 1
        run: node eng/progpu-test-cad-browser.mjs
      - name: Upload CAD browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: progpu-cad-browser
          path: artifacts/progpu-cad/browser-smoke/
          if-no-files-found: warn

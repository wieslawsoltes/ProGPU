name: HMI graphic conventions integration
on:
  push:
    branches: [feat/hmi-designer]
    paths: ['eng/hmi-graphics-apply.py', 'eng/hmi-graphics-payload.*']
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/ProGPU' && github.ref == 'refs/heads/feat/hmi-designer'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PROGPU_WGPU_BACKEND: vulkan
      XDG_RUNTIME_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply the integrity-checked source and commit the exact tested tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 eng/hmi-graphics-apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(hmi): add graphic conventions, instrument symbols and direct caption authoring'
          git push origin HEAD:refs/heads/feat/hmi-designer
          mkdir -p artifacts/hmi-graphics-validation
          git rev-parse HEAD | tee artifacts/hmi-graphics-validation/commit.txt
          dotnet --info > artifacts/hmi-graphics-validation/dotnet-info.txt
      - name: Reflection-disabled HMI and transport regressions
        run: dotnet test tests/ProGPU.Hmi.Tests/ProGPU.Hmi.Tests.csproj -c Release --logger "trx;LogFileName=hmi.trx" --results-directory artifacts/hmi-graphics-validation/tests
      - name: Real OPC UA loopback-server regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: dotnet test tests/ProGPU.Hmi.OpcUa.Tests/ProGPU.Hmi.OpcUa.Tests.csproj -c Release --logger "trx;LogFileName=opcua.trx" --results-directory artifacts/hmi-graphics-validation/tests
      - name: Reflection-disabled conventions and routing serialization
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: dotnet run --project tests/ProGPU.Hmi.SerializationSmoke/ProGPU.Hmi.SerializationSmoke.csproj -c Release
      - name: Build standalone HMI designer
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: dotnet build samples/HmiDesigner/HmiDesigner.csproj -c Release
      - name: Build actual desktop-gallery portable host
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: dotnet build src/ProGPU.Samples.Desktop/ProGPU.Samples.Desktop.csproj -c Release -f net10.0 -p:ProGpuSamplesDesktopPortableOnly=true
      - name: Construct the actual reflection-disabled gallery page
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: dotnet run --project tests/ProGPU.Hmi.GallerySmoke/ProGPU.Hmi.GallerySmoke.csproj -c Release
      - name: Publish and execute NativeAOT serializer and router
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish tests/ProGPU.Hmi.SerializationSmoke/ProGPU.Hmi.SerializationSmoke.csproj -c Release -r linux-x64 -p:PublishAot=true -p:TreatWarningsAsErrors=true -o artifacts/hmi-aot
          artifacts/hmi-aot/ProGPU.Hmi.SerializationSmoke
      - name: Native retained graphics, WYSIWYG pixels and pointer interactions in all palettes
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 fonts-dejavu-core
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' -print -quit)
          test -n "$VK_ICD_FILENAMES"
          cat "$VK_ICD_FILENAMES" > artifacts/hmi-graphics-validation/vulkan-icd.json
          dotnet build tests/ProGPU.Hmi.VisualSmoke/ProGPU.Hmi.VisualSmoke.csproj -c Release
          for palette in Light Dark HighContrast; do
            timeout -k 5s 180s dotnet run --project tests/ProGPU.Hmi.VisualSmoke/ProGPU.Hmi.VisualSmoke.csproj -c Release --no-build -- /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf artifacts/hmi-graphics-validation/visuals "$palette" | tee "artifacts/hmi-graphics-validation/$palette.log"
          done
      - name: Pack the six reusable HMI libraries
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for project in ProGPU.Hmi ProGPU.WinUI.Hmi ProGPU.WinUI.Hmi.Designer ProGPU.Hmi.Modbus ProGPU.Hmi.Mqtt ProGPU.Hmi.OpcUa; do
            dotnet pack "src/$project/$project.csproj" -c Release --no-build -o artifacts/hmi-graphics-validation/packages
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hmi-graphic-conventions-validation
          path: artifacts/hmi-graphics-validation
          retention-days: 14
          if-no-files-found: warn

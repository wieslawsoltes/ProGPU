name: Dawn system WARP

on:
  # The complete Build calls this once; avoid duplicating native producers for
  # the same pull-request push. Manual dispatch remains available for diagnosis.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  original-warp:
    name: Original Dawn WARP (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preserve caller-owned build and publish destinations
        shell: pwsh
        run: |
          foreach ($collision in @('none','filename','link','target','destination','publish')) {
            foreach ($enabled in @('true','false')) {
              $output = & dotnet msbuild eng/test-dawn-system-warp-package-targets.proj -nologo '-p:RuntimeIdentifier=${{ matrix.rid }}' "-p:Collision=$collision" "-p:ProGpuEnableDawnSystemWarp=$enabled" 2>&1
              $result = $LASTEXITCODE
              $output | Write-Output
              $reject = $enabled -eq 'true' -and $collision -ne 'none'
              if ($reject) {
                if ($result -eq 0 -or -not ($output -match 'Dawn system WARP will not replace caller-owned')) { throw "Expected explicit collision rejection: $collision" }
              } elseif ($result -ne 0) { throw "Unrelated or disabled companion content was rejected: $collision" }
            }
          }
      - name: Build original-header companion and run independent JIT and NativeAOT readbacks
        shell: pwsh
        run: ./eng/test-dawn-system-warp-windows.ps1 -Rid '${{ matrix.rid }}'
      - name: Preserve exact startup and readback evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dawn-system-warp-${{ matrix.rid }}
          path: artifacts/dawn-system-warp/${{ matrix.rid }}/
          if-no-files-found: warn
      - name: Publish the successfully checked companion payload
        uses: actions/upload-artifact@v7
        with:
          name: progpu-dawn-warp-runtime-${{ matrix.rid }}
          path: artifacts/dawn-system-warp/payload/
          if-no-files-found: error

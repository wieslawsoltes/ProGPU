name: SkiaSharp benchmarks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - src/SkiaSharp/**
      - src/ProGPU.Vector/**
      - tools/ProGPU.SkiaSharp.Benchmarks/**
      - tools/ProGPU.SkiaSharp.Benchmarks.Native/**
      - eng/progpu-run-skiasharp-benchmarks.sh
      - .github/workflows/skiasharp-benchmarks.yml
  schedule:
    - cron: '30 2 * * 2'

permissions:
  contents: read

jobs:
  matched-cpu:
    name: Matched native and ProGPU CPU benchmarks
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Linux WebGPU dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan1 \
            mesa-vulkan-drivers \
            libx11-xcb1 \
            libxcb1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-present0 \
            libxkbcommon0

      - name: Run matched benchmark distributions
        shell: bash
        run: ./eng/progpu-run-skiasharp-benchmarks.sh

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skiasharp-benchmarks-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/performance/skiasharp/**
          if-no-files-found: error

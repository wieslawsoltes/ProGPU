name: HMI v2 integration validation
on:
  push:
    branches: [feat/hmi-designer]
    paths: ['eng/hmi-v2-integrate.py']
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/ProGPU' && github.ref == 'refs/heads/feat/hmi-designer'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply guarded integration
        id: integrate
        run: python3 eng/hmi-v2-integrate.py
      - name: Commit integrated sources
        run: |
          git diff --check
          git add src samples/HmiDesigner tests/ProGPU.Hmi.Tests Directory.Packages.props eng/progpu-package-list.sh README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(hmi): integrate live transports, equipment faceplates and state-aware components'
          git push origin HEAD:refs/heads/feat/hmi-designer
      - name: Validate models, transports and designer
        run: dotnet test tests/ProGPU.Hmi.Tests/ProGPU.Hmi.Tests.csproj -c Release --logger "trx;LogFileName=hmi-v2.trx" --results-directory artifacts/hmi/tests
      - name: Build standalone sample
        if: ${{ !cancelled() && steps.integrate.outcome == 'success' }}
        run: dotnet build samples/HmiDesigner/HmiDesigner.csproj -c Release
      - name: Build shared gallery
        if: ${{ !cancelled() && steps.integrate.outcome == 'success' }}
        run: dotnet build src/ProGPU.Samples/ProGPU.Samples.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hmi-v2-integration-tests
          path: artifacts/hmi
          if-no-files-found: ignore

name: WPF Display text reference

on:
  pull_request:
    paths:
      - 'eng/WpfDisplayTextReference/**'
      - '.github/workflows/wpf-display-text-reference.yml'
      - 'src/ProGPU.Fonts.Inter/Fonts/Inter-Regular.ttf'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    name: Original WPF Display (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: X64
          - os: windows-11-arm
            arch: Arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      REFERENCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REFERENCE_COMMIT }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Compile original Microsoft WPF reference
        shell: pwsh
        run: |
          dotnet build eng/WpfDisplayTextReference/WpfDisplayTextReference.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture exact source glyph and interaction metrics
        shell: pwsh
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'artifacts/wpf-display-reference'
          if (Test-Path -LiteralPath $evidence) { throw 'Evidence directory already exists.' }
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $dll = Join-Path $env:GITHUB_WORKSPACE 'eng/WpfDisplayTextReference/bin/Release/net10.0-windows/WpfDisplayTextReference.dll'
          $font = Join-Path $env:GITHUB_WORKSPACE 'src/ProGPU.Fonts.Inter/Fonts/Inter-Regular.ttf'
          $receipt = Join-Path $evidence 'reference.json'
          $stdout = Join-Path $evidence 'stdout.log'
          $stderr = Join-Path $evidence 'stderr.log'
          $arguments = @($dll, $font, $receipt, '${{ matrix.arch }}', $env:REFERENCE_COMMIT) | ForEach-Object { '"' + $_ + '"' }
          $child = Start-Process (Get-Command dotnet).Source -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            if (!$child.WaitForExit(90000)) { throw 'Original reference process exceeded 90 seconds.' }
            if ($child.ExitCode -ne 0) { throw "Original reference exited $($child.ExitCode)." }
            $value = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
            if ($value.SourceCommit -ne $env:REFERENCE_COMMIT -or $value.CaseCount -ne 192 -or $value.Cases.Count -ne 192 -or $value.Architecture -ne '${{ matrix.arch }}') { throw 'Incomplete or wrong-identity reference.' }
            Get-FileHash -Algorithm SHA256 -LiteralPath $receipt | Format-List
          } finally {
            if (!$child.HasExited) { $child.Kill($true); $child.WaitForExit(5000) | Out-Null }
            $child.Dispose()
            Get-Content -LiteralPath $stdout
            Get-Content -LiteralPath $stderr
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wpf-display-reference-${{ matrix.arch }}-${{ env.REFERENCE_COMMIT }}
          path: artifacts/wpf-display-reference/
          if-no-files-found: error

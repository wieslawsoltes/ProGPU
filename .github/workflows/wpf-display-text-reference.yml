name: WPF Display drawing-frame diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    name: Supplemental original WPF drawing (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: X64
          - os: windows-11-arm
            arch: Arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Prepare pinned framework sources
        shell: bash
        run: python3 eng/progpu-prepare-framework-sources.py
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Compile supplemental Microsoft API observer
        shell: pwsh
        run: |
          dotnet build eng/WpfDisplayTextReference/WpfDisplayTextReference.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test eng/WpfDisplayTextReference.Tests/WpfDisplayTextReference.Tests.csproj -c Release -m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture full original inputs with additional drawing frames
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $originalSource = '92f4778b0db2d802d84b50281bc4c4e97349b4db'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'artifacts/wpf-display-drawing'
          if (Test-Path -LiteralPath $evidence) { throw 'Evidence directory exists.' }
          New-Item -ItemType Directory -Path $evidence | Out-Null
          @{ ObserverCommit = '${{ github.sha }}'; OriginalSourceCommit = $originalSource; RunId = '${{ github.run_id }}'; Architecture = '${{ matrix.arch }}'; Purpose = 'Additional offscreen TextLine.Draw observations; original receipts remain independent and unchanged.' } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'provenance.json')
          $dll = Join-Path $env:GITHUB_WORKSPACE 'eng/WpfDisplayTextReference/bin/Release/net10.0-windows/WpfDisplayTextReference.dll'
          $font = Join-Path $env:GITHUB_WORKSPACE 'src/ProGPU.Fonts.Inter/Fonts/Inter-Regular.ttf'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $font).Hash -cne '40D692FCE188E4471E2B3CBA937BE967878F631AD3EBBBDCD587687C7EBE0C82') { throw 'Original Inter bytes changed.' }
          $pin = Get-Content -LiteralPath 'eng/WpfDisplayTextReference/rtl-font.json' -Raw | ConvertFrom-Json
          $rtlDirectory = Join-Path $evidence 'rtl-font'
          New-Item -ItemType Directory -Path $rtlDirectory | Out-Null
          $base = ($pin.Repository -replace '^https://github.com/', 'https://raw.githubusercontent.com/') + '/' + $pin.Commit
          foreach ($item in @(@($pin.FontPath, $pin.FontFileName, $pin.FontLength, $pin.FontSha256), @($pin.LicensePath, $pin.LicenseFileName, $pin.LicenseLength, $pin.LicenseSha256))) {
            $path = Join-Path $rtlDirectory $item[1]
            Invoke-WebRequest -Uri ($base + '/' + $item[0]) -OutFile $path -TimeoutSec 30
            if ((Get-Item -LiteralPath $path).Length -ne $item[2] -or (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash -cne $item[3]) { throw 'RTL font or notice pin mismatch.' }
          }
          foreach ($family in @('source-inputs', 'source-midpoint-inputs')) {
            $receipt = Join-Path $evidence ($family + '.json')
            $stdout = Join-Path $evidence ($family + '-stdout.log')
            $stderr = Join-Path $evidence ($family + '-stderr.log')
            $values = @($dll, '--source-inputs', $font, $receipt, '${{ matrix.arch }}', $originalSource)
            if ($family -eq 'source-midpoint-inputs') { $values += @('midpoint-rtl-positioned-v3', $rtlDirectory) }
            $arguments = $values | ForEach-Object { '"' + $_ + '"' }
            $child = Start-Process (Get-Command dotnet).Source -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            try {
              if (!$child.WaitForExit(60000)) { throw 'Supplemental reference exceeded the original sixty-second bound.' }
              if ($child.ExitCode -ne 0) { throw "Supplemental reference exited $($child.ExitCode)." }
              $value = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
              $count = if ($family -eq 'source-inputs') { 192 } else { 288 }
              $schema = if ($family -eq 'source-inputs') { 102 } else { 104 }
              if ($value.Schema -ne $schema -or !$value.SupplementalDrawingFrames -or $value.OriginalSourceCommit -ne $originalSource -or $value.CaseCount -ne $count -or $value.Cases.Count -ne $count -or $value.Architecture -ne '${{ matrix.arch }}') { throw 'Incomplete or wrong-identity supplemental corpus.' }
              foreach ($case in $value.Cases) {
                $original = if ($family -eq 'source-inputs') { $case } else { $case.Original }
                foreach ($line in $original.Lines) { if (!$line.SupplementalDrawingFrame) { throw 'Missing actual drawing frame.' } }
              }
              Get-FileHash -Algorithm SHA256 -LiteralPath $receipt | Format-List
            } finally {
              if (!$child.HasExited) { $child.Kill($true); $child.WaitForExit(5000) | Out-Null }
              $child.Dispose()
              Get-Content -LiteralPath $stdout
              Get-Content -LiteralPath $stderr
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wpf-display-drawing-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/wpf-display-drawing/
          if-no-files-found: error

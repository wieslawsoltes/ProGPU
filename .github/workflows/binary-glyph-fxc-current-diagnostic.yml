name: Binary glyph FXC current compile diagnostic
on:
  pull_request:
    branches: [fix/source-binary-glyph-raster]
    paths:
      - '.github/workflows/binary-glyph-fxc-current-diagnostic.yml'
      - 'eng/diagnostics/binary-glyph-fxc-current/**'
permissions:
  contents: read
jobs:
  compile:
    if: github.head_ref == 'diag/binary-glyph-fxc-current-20261028'
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        variant: [cs_binary_horizontal, cs_binary_vertical]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Patched producer, original shader and release compiler flags
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python eng/diagnostics/binary-glyph-fxc-current/run.py "${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-fxc-${{ matrix.variant }}
          path: eng/diagnostics/binary-glyph-fxc-current/evidence
          if-no-files-found: error

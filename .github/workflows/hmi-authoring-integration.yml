name: HMI canvas authoring integration
on:
  push:
    branches: [feat/hmi-designer]
    paths: ['eng/hmi-authoring-apply.py']
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/ProGPU' && github.ref == 'refs/heads/feat/hmi-designer'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PROGPU_WGPU_BACKEND: vulkan
      XDG_RUNTIME_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply exact source preimages and record the committed implementation
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python3 eng/hmi-authoring-apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(hmi): add retained draw-to-size placement and directional marquee selection'
          git push origin HEAD:refs/heads/feat/hmi-designer
          mkdir -p artifacts/hmi-authoring
          git rev-parse HEAD | tee artifacts/hmi-authoring/commit.txt
          dotnet --info > artifacts/hmi-authoring/dotnet-info.txt
      - name: Reflection-disabled HMI and transport regression suite
        run: dotnet test tests/ProGPU.Hmi.Tests/ProGPU.Hmi.Tests.csproj -c Release --logger "trx;LogFileName=hmi.trx" --results-directory artifacts/hmi-authoring/tests
      - name: Real OPC UA loopback-server regression suite
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        run: dotnet test tests/ProGPU.Hmi.OpcUa.Tests/ProGPU.Hmi.OpcUa.Tests.csproj -c Release --logger "trx;LogFileName=opcua.trx" --results-directory artifacts/hmi-authoring/tests
      - name: Reflection-disabled serializer and router
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        run: dotnet run --project tests/ProGPU.Hmi.SerializationSmoke/ProGPU.Hmi.SerializationSmoke.csproj -c Release
      - name: Build standalone HMI designer
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        run: dotnet build samples/HmiDesigner/HmiDesigner.csproj -c Release
      - name: Build actual desktop-gallery portable host
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        run: dotnet build src/ProGPU.Samples.Desktop/ProGPU.Samples.Desktop.csproj -c Release -f net10.0 -p:ProGpuSamplesDesktopPortableOnly=true
      - name: Construct actual gallery page without reflection JSON
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        run: dotnet run --project tests/ProGPU.Hmi.GallerySmoke/ProGPU.Hmi.GallerySmoke.csproj -c Release
      - name: Publish and execute real NativeAOT serializer and router
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish tests/ProGPU.Hmi.SerializationSmoke/ProGPU.Hmi.SerializationSmoke.csproj -c Release -r linux-x64 -p:PublishAot=true -p:TreatWarningsAsErrors=true -o artifacts/hmi-aot
          artifacts/hmi-aot/ProGPU.Hmi.SerializationSmoke
      - name: All retained graphics and authoring pointer probes in three palettes
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 fonts-dejavu-core
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' -print -quit)
          test -n "$VK_ICD_FILENAMES"
          cat "$VK_ICD_FILENAMES" > artifacts/hmi-authoring/vulkan-icd.json
          dotnet build tests/ProGPU.Hmi.VisualSmoke/ProGPU.Hmi.VisualSmoke.csproj -c Release
          for palette in Light Dark HighContrast; do
            timeout -k 5s 180s dotnet run --project tests/ProGPU.Hmi.VisualSmoke/ProGPU.Hmi.VisualSmoke.csproj -c Release --no-build -- /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf artifacts/hmi-authoring/visuals "$palette" | tee "artifacts/hmi-authoring/$palette.log"
          done
      - name: Pack six standalone HMI libraries
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for project in ProGPU.Hmi ProGPU.WinUI.Hmi ProGPU.WinUI.Hmi.Designer ProGPU.Hmi.Modbus ProGPU.Hmi.Mqtt ProGPU.Hmi.OpcUa; do
            dotnet pack "src/$project/$project.csproj" -c Release --no-build -o artifacts/hmi-authoring/packages
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hmi-canvas-authoring-validation
          path: artifacts/hmi-authoring
          retention-days: 14

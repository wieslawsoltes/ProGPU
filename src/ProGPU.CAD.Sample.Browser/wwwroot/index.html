<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <base href="./">
  <link rel="icon" href="data:,">
  <title>ProGPU.CAD Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="progpu-canvas" aria-label="Interactive ProGPU CAD viewport"></canvas>
  <aside id="diagnostics" aria-live="polite" hidden>
    <h1 id="status-title">Starting CAD viewer…</h1>
    <pre id="status-detail">Loading the drawing workspace.</pre>
    <dl>
      <div><dt>Frames</dt><dd id="counter-frames">0</dd></div>
      <div><dt>Dispatches</dt><dd id="counter-dispatches">0</dd></div>
      <div><dt>Command bytes</dt><dd id="counter-bytes">0</dd></div>
    </dl>
  </aside>
  <script type="module" src="main.js"></script>
</body>
</html>

[package]
name = "progpu-freetype"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "ProGPU's exclusive safe binding to its verified original FreeType dependency"
repository = "https://github.com/wieslawsoltes/ProGPU"
links = "progpu_verified_freetype"
build = "build.rs"
include = ["/Cargo.toml", "/build.rs", "/src/**", "/build-support/**", "/README.md", "/LICENSE"]

[build-dependencies]
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

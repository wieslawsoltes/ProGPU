[package]
name = "progpu-native-sys"
version = "0.1.0-preview.70"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Raw bindings of the ProGPU native C ABI (progpu_native.h) and of the wgpu-native WebGPU C ABI it runs on, with the engine and wgpu-native linked statically"
repository = "https://github.com/wieslawsoltes/ProGPU"
links = "progpu_native"
build = "build.rs"
include = ["Cargo.toml", "build.rs", "src/**", "headers/**", "native/**", "README.md", "LICENSE"]

[lib]
path = "src/lib.rs"

[dependencies]
# The WebGPU implementation of the engine, linked statically: wgpu-native (the C ABI of webgpu.h
# over wgpu-core and wgpu-hal 30.0.1, the crates of the wgpu crate 30.0.1) with the native-object
# interop (FerroUI/wgpu-native, branch progpu/wgpu-30). WGSL only: the engine's shaders are
# WGSL.
wgpu-native = { git = "https://github.com/FerroUI/wgpu-native", rev = "309bf22", default-features = false, features = ["wgsl", "metal", "dx12"] }

# The backends of Linux. wgpu-core takes Metal on Apple targets and DX12 on Windows from the
# features above and nothing on Linux, where a device then finds no adapter unless another crate
# of the build enables a backend of the shared wgpu-core. The bindings enable theirs themselves:
# Vulkan, and OpenGL ES for hosts without a Vulkan driver.
[target.'cfg(target_os = "linux")'.dependencies]
wgpu-native = { git = "https://github.com/FerroUI/wgpu-native", rev = "309bf22", default-features = false, features = ["vulkan", "gles"] }

[build-dependencies]
cc = "1"
sha2 = "0.10"

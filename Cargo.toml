[package]
name = "progpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT AND Unicode-3.0"
description = "ProGPU's native Rust rendering engine using canonical WebGPU shaders"
repository = "https://github.com/wieslawsoltes/ProGPU"
readme = "src/ProGPU.Rust/README.md"
include = [
    "/src/ProGPU.Scene/Shaders/Mesh3DSolid.wgsl",
    "/src/ProGPU.Scene/Shaders/Mesh3DWireframe.wgsl",
    "/src/ProGPU.Scene/Shaders/Mesh3DEdges.wgsl",
    "/src/ProGPU.Scene/Shaders/CustomGrid.wgsl",
    "/src/ProGPU.Vector/Shaders/GpuHitTesting.wgsl",
    "/src/ProGPU.Scene/Shaders/Hatch.wgsl",
    "/src/ProGPU.Scene/Shaders/Line3D.wgsl",
    "/src/ProGPU.Scene/Shaders/AcisSolid.wgsl",
    "/src/ProGPU.Scene/Shaders/BackdropMaterial.wgsl",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/src/ProGPU.Rust/**",
    "/src/ProGPU.Backend/Shaders/*.wgsl",
    "/src/ProGPU.Scene/Shaders/ImageEffect.wgsl",
    "/src/ProGPU.Scene/Shaders/GpuLineSeries.wgsl",
    "/src/ProGPU.Scene/Shaders/GpuScatterSeries.wgsl",
    "/src/ProGPU.Scene/Shaders/WpfBytecodeEffect.wgsl",
    "/src/ProGPU.Scene/Shaders/WpfBytecodeSampleEffect.wgsl",
    "/src/ProGPU.Scene/Shaders/WpfBytecodeAffineEffect.wgsl",
    "/src/ProGPU.Scene/Shaders/WpfEffectHeader.wgsl",
    "/src/ProGPU.Scene/Shaders/WpfEffectMaskDeclarations.wgsl",
    "/src/ProGPU.Scene/Shaders/WpfEffectMaskHelper.wgsl",
    "/src/ProGPU.Scene/Shaders/WpfEffectNoMaskHelper.wgsl",
    "/src/ProGPU.Scene/Shaders/WpfEffectPassThrough.wgsl",
    "/src/ProGPU.Scene/Shaders/WpfEffectStraightWrapper.wgsl",
    "/src/ProGPU.Scene/Shaders/WpfEffectPremultipliedWrapper.wgsl",
    "/src/ProGPU.Scene/Shaders/WpfEffectStraightToPremultipliedWrapper.wgsl",
    "/src/ProGPU.Compute/Shaders/ColorTable.wgsl",
    "/src/ProGPU.Compute/Shaders/NonlinearColorFilter.wgsl",
    "/src/ProGPU.Compute/Shaders/OverdrawColorFilter.wgsl",
    "/src/ProGPU.Compute/Shaders/ImageBlend.wgsl",
    "/src/ProGPU.Compute/Shaders/ArithmeticComposite.wgsl",
    "/src/ProGPU.Compute/Shaders/Morphology.wgsl",
    "/src/ProGPU.Compute/Shaders/MatrixConvolution.wgsl",
    "/src/ProGPU.Compute/Shaders/DisplacementMap.wgsl",
    "/src/ProGPU.Compute/Shaders/Magnifier.wgsl",
    "/src/ProGPU.Compute/Shaders/ImageLighting.wgsl",
    "/src/ProGPU.Compute/Shaders/GaussianBlurHorizontal.wgsl",
    "/src/ProGPU.Compute/Shaders/GaussianBlurVertical.wgsl",
    "/src/ProGPU.Compute/Shaders/GroupDropShadowCompose.wgsl",
    "/src/ProGPU.Compute/Shaders/DropShadow.wgsl",
    "/src/ProGPU.Compute/Shaders/ShadowBlurHorizontal.wgsl",
    "/src/ProGPU.Compute/Shaders/ShadowBlurVertical.wgsl",
    "/src/ProGPU.Text/UnicodeNormalizationData.bin",
]

[lib]
path = "src/ProGPU.Rust/src/lib.rs"

[features]
default = ["gpu"]
gpu = ["dep:wgpu"]
native-freetype = ["dep:progpu-freetype"]
window = ["gpu", "dep:winit", "dep:pollster"]
browser = ["gpu", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
thiserror = "2"
wgpu = { version = "30.0.1", optional = true }
winit = { version = "0.30.13", optional = true }
pollster = { version = "0.4", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "hdr", "pnm", "tga"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
roxmltree = { version = "0.21.2", default-features = false, features = ["std"] }
wide = "=0.7.33"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
progpu-freetype = { version = "0.1.0", path = "src/ProGPU.Rust/freetype", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.130", optional = true }
wasm-bindgen-futures = { version = "0.4.80", optional = true }
js-sys = { version = "0.3.107", optional = true }
web-sys = { version = "0.3.107", features = ["HtmlCanvasElement", "console"], optional = true }

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }
pollster = "0.4"

